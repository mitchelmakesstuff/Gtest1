<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project 2 - Stage 8</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      background: #0d0f12;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1/1;
      background: #000;
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #1a1c23;
      border-bottom: 2px solid #333;
    }
    #location { color: #ffcc00; }
    #controls {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      padding: 10px;
      background: #1a1c23;
    }
    button {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #2a2e38;
      color: #fff;
      border: 1px solid #444;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { background: #444; }
    .action-btn { background: #444; font-size: 14px; }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10,12,16,0.95);
      padding: 20px;
      border: 2px solid #ffcc00;
      border-radius: 10px;
      text-align: center;
      display: none;
      z-index: 10;
      width: 80%;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.2);
    }
    .msg-buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
    .msg-buttons button { padding: 10px 20px; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 14px;}
    .btn-yes { background: #4caf50; color: #fff; }
    .btn-no { background: #f44336; color: #fff; }
    .btn-ok { background: #ffcc00; color: #000; }
  </style>
</head>
<body>

  <div id="ui">
    <div>HP: <span id="hp" style="color:#ff5555">12</span></div>
    <div>ATK: <span id="atk" style="color:#55ff55">2</span></div>
    <div>GOLD: <span id="gold" style="color:#ffcc00">0</span></div>
    <div>KEY: <span id="hasKey" style="color:#ff3333">No</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div id="message">
      <h2 id="msg-title" style="margin:0 0 15px 0; color: #fff;">You Died</h2>
      <div class="msg-buttons" id="msg-actions"></div>
    </div>
  </div>

  <div id="controls">
    <button class="action-btn" onclick="doTurn(0, 0, 'rest')">REST</button>
    <button onclick="doTurn(0, -1)">▲</button>
    <button class="action-btn" onclick="doTurn(0, 0, 'wait')">WAIT</button>
    <button onclick="doTurn(-1, 0)">◀</button>
    <button onclick="doTurn(0, 1)">▼</button>
    <button onclick="doTurn(1, 0)">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const TILE_SIZE = 16;
    const MAP_SIZE = 20;

    let player = { x: 10, y: 16, hp: 12, maxHp: 12, atk: 2, gold: 0, hasKey: false };
    let gameState = 'PLAYING'; 
    let currentMap = 'HUB';
    let shakeTime = 0;

    function addWalls(map, x1, y1, x2, y2) {
      for (let y = y1; y <= y2; y++) {
        for (let x = x1; x <= x2; x++) {
          if (x === x1 || y === y1 || x === x2 || y === y2) {
            map.walls.push({x, y});
          }
        }
      }
    }

    let maps = {
      HUB: { name: "Courtyard", walls: [], doors: [], enemy: null, loot: null, exit: null, bossDoor: null, npc: null, drops: [] },
      BLACKSMITH: { name: "Blacksmith", walls: [], doors: [], enemy: null, loot: null, npc: null, drops: [] },
      HOUSE: { name: "Abandoned House", walls: [], doors: [], enemy: null, loot: null, npc: null, offeringTree: null, drops: [] },
      BOSS_ROOM: { name: "Boss Lair", walls: [], doors: [], enemy: null, loot: null, npc: null, drops: [] }
    };

    function buildMaps() {
      // --- HUB ---
      let hub = maps.HUB;
      hub.walls = []; hub.drops = [];
      addWalls(hub, 0, 0, 19, 19);
      addWalls(hub, 5, 10, 14, 10);
      
      hub.doors = [
        { x: 4, y: 1, target: 'BLACKSMITH', spawnX: 10, spawnY: 16, color: '#ffaa00' },
        { x: 10, y: 1, target: 'HOUSE', spawnX: 10, spawnY: 16, color: '#ff00ff' }
      ];
      hub.bossDoor = { x: 16, y: 1, target: 'BOSS_ROOM', spawnX: 10, spawnY: 16, color: '#00aaff' };
      
      hub.enemy = { type: 'goblin', x: 10, y: 6, hp: 6, maxHp: 6, atk: 2, alive: true };
      hub.loot = { x: 17, y: 17, active: true, type: 'atk' };

      // --- BLACKSMITH ---
      let smith = maps.BLACKSMITH;
      smith.walls = []; smith.drops = [];
      addWalls(smith, 0, 0, 19, 19);
      addWalls(smith, 3, 5, 16, 5); 
      addWalls(smith, 3, 5, 3, 12); 
      addWalls(smith, 16, 5, 16, 12);
      
      smith.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 4, spawnY: 2, color: '#ffffff' }];
      // REBALANCED TIN MAN: HP 10, ATK 3
      smith.enemy = { type: 'tinman', x: 10, y: 10, hp: 10, maxHp: 10, atk: 3, alive: true }; 
      smith.loot = { x: 10, y: 7, active: true, type: 'key' };
      // NPC is now a shopkeeper
      smith.npc = { x: 6, y: 7, type: 'shop' };

      // --- HOUSE ---
      let house = maps.HOUSE;
      house.walls = []; house.drops = [];
      addWalls(house, 0, 0, 19, 19);
      addWalls(house, 5, 5, 14, 14); 
      house.walls = house.walls.filter(w => !(w.x === 10 && w.y === 14)); 
      
      house.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 10, spawnY: 2, color: '#ffffff' }];
      house.enemy = { type: 'goblin', x: 10, y: 10, hp: 8, maxHp: 8, atk: 2, alive: true }; 
      // Added a health potion near the door
      house.loot = { x: 10, y: 16, active: true, type: 'hp' }; 
      house.offeringTree = { x: 10, y: 7, used: false };

      // --- BOSS ROOM ---
      let boss = maps.BOSS_ROOM;
      boss.walls = []; boss.drops = [];
      addWalls(boss, 0, 0, 19, 19);
      boss.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 16, spawnY: 2, color: '#ffffff' }];
      boss.exit = { x: 10, y: 2 }; 
      // Boss slightly tuned too
      boss.enemy = { type: 'boss', x: 10, y: 6, hp: 25, maxHp: 25, atk: 4, alive: true };
    }

    function isWall(x, y) {
      return maps[currentMap].walls.some(w => w.x === x && w.y === y);
    }

    // --- DRAWING ---
    function drawPlayer(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#333'; ctx.fillRect(px + 2, py + 4, 12, 10);
      ctx.fillStyle = '#fff'; ctx.fillRect(px + 4, py + 1, 8, 5);
      ctx.fillStyle = '#000'; ctx.fillRect(px + 5, py + 3, 6, 2);
      ctx.fillStyle = '#ccc'; ctx.fillRect(px + 13, py + 6, 3, 6);
    }

    function drawGoblin(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#2a7a2a'; ctx.fillRect(px + 3, py + 4, 10, 8);
      ctx.fillStyle = '#111'; ctx.fillRect(px + 5, py + 6, 2, 2); ctx.fillRect(px + 9, py + 6, 2, 2);
      ctx.fillStyle = '#a33'; ctx.fillRect(px + 12, py + 8, 3, 6);
    }

    function drawTinMan(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#888'; ctx.fillRect(px + 2, py + 2, 12, 12);
      ctx.fillStyle = '#555'; ctx.fillRect(px + 4, py + 4, 8, 8);
      ctx.fillStyle = '#f00'; ctx.fillRect(px + 7, py + 6, 2, 2);
    }

    function drawBoss(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#6a0dad'; ctx.fillRect(px + 1, py + 1, 14, 14);
      ctx.fillStyle = '#ff00ff'; ctx.fillRect(px + 3, py + 4, 3, 3); ctx.fillRect(px + 10, py + 4, 3, 3);
      ctx.fillStyle = '#fff'; ctx.fillRect(px + 4, py + 10, 8, 2);
      ctx.fillStyle = '#000'; ctx.fillRect(px + 6, py + 11, 1, 1); ctx.fillRect(px + 9, py + 11, 1, 1);
    }

    function drawKey(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(px + 6, py + 4, 4, 8);
      ctx.fillStyle = '#ff0000'; ctx.fillRect(px + 4, py + 2, 8, 4);
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(px + 10, py + 10, 4, 2);
    }

    function drawPotion(x, y, type) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      if (type === 'hp') {
        ctx.fillStyle = '#ff3333'; ctx.fillRect(px + 4, py + 6, 8, 8);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 6, py + 3, 4, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 7, py + 8, 2, 4); ctx.fillRect(px + 6, py + 9, 4, 2); // Cross
      } else {
        ctx.fillStyle = '#00aaff'; ctx.fillRect(px + 4, py + 6, 8, 8);
        ctx.fillStyle = '#fff'; ctx.fillRect(px + 6, py + 3, 4, 3);
      }
    }

    function drawNPC(x, y, color) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = color; ctx.fillRect(px + 3, py + 4, 10, 10);
      ctx.fillStyle = '#fff'; ctx.fillRect(px + 5, py + 6, 2, 2); ctx.fillRect(px + 9, py + 6, 2, 2);
    }

    function drawTree(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#5c3a21'; ctx.fillRect(px + 6, py + 8, 4, 8);
      ctx.fillStyle = '#2e8b57'; ctx.fillRect(px + 2, py + 2, 12, 8); ctx.fillRect(px + 4, py, 8, 12);
      ctx.fillStyle = '#ffcc00'; ctx.fillRect(px + 5, py + 5, 2, 2); ctx.fillRect(px + 9, py + 5, 2, 2);
    }

    function drawCoin(x, y) {
      const px = x * TILE_SIZE; const py = y * TILE_SIZE;
      ctx.fillStyle = '#ffcc00'; 
      ctx.beginPath(); ctx.arc(px + 8, py + 8, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#cc9900'; 
      ctx.beginPath(); ctx.arc(px + 8, py + 8, 2, 0, Math.PI * 2); ctx.fill();
    }

    function draw() {
      let map = maps[currentMap];
      
      let offsetX = 0, offsetY = 0;
      if (shakeTime > 0) {
        offsetX = (Math.random() - 0.5) * 6;
        offsetY = (Math.random() - 0.5) * 6;
        shakeTime = 0; 
      }
      
      ctx.save();
      ctx.translate(offsetX, offsetY);

      ctx.fillStyle = '#121418';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#3a404a';
      map.walls.forEach(w => {
        ctx.fillRect(w.x * TILE_SIZE, w.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#4a505a'; ctx.fillRect(w.x * TILE_SIZE, w.y * TILE_SIZE, TILE_SIZE, 2); ctx.fillStyle = '#3a404a';
      });

      if (map.doors) {
        map.doors.forEach(d => {
          ctx.fillStyle = d.color; ctx.fillRect(d.x * TILE_SIZE, d.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(d.x * TILE_SIZE + 1, d.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        });
      }

      if (map.bossDoor) {
        ctx.fillStyle = map.bossDoor.color; ctx.fillRect(map.bossDoor.x * TILE_SIZE, map.bossDoor.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        if (!player.hasKey) {
          ctx.fillStyle = '#111'; ctx.fillRect(map.bossDoor.x * TILE_SIZE + 5, map.bossDoor.y * TILE_SIZE + 6, 6, 6);
          ctx.fillStyle = '#ccc'; ctx.fillRect(map.bossDoor.x * TILE_SIZE + 7, map.bossDoor.y * TILE_SIZE + 8, 2, 2);
        }
      }

      if (map.exit) {
        ctx.fillStyle = '#00ffff'; ctx.fillRect(map.exit.x * TILE_SIZE, map.exit.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        ctx.fillStyle = '#fff'; ctx.fillRect(map.exit.x * TILE_SIZE + 4, map.exit.y * TILE_SIZE + 4, 8, 8);
      }

      if (map.loot && map.loot.active) {
        if (map.loot.type === 'key') drawKey(map.loot.x, map.loot.y);
        else drawPotion(map.loot.x, map.loot.y, map.loot.type);
      }

      if (map.drops) {
        map.drops.forEach(d => drawCoin(d.x, d.y));
      }

      if (map.npc) drawNPC(map.npc.x, map.npc.y, '#c39b5a');
      if (map.offeringTree) drawTree(map.offeringTree.x, map.offeringTree.y);

      if (map.enemy && map.enemy.alive) {
        if (map.enemy.type === 'goblin') drawGoblin(map.enemy.x, map.enemy.y);
        if (map.enemy.type === 'tinman') drawTinMan(map.enemy.x, map.enemy.y);
        if (map.enemy.type === 'boss') drawBoss(map.enemy.x, map.enemy.y);

        const hpPercent = map.enemy.hp / map.enemy.maxHp;
        ctx.fillStyle = '#111'; ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 5, TILE_SIZE, 3);
        ctx.fillStyle = hpPercent > 0.5 ? '#4caf50' : (hpPercent > 0.25 ? '#ff9800' : '#f44336');
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 5, TILE_SIZE * hpPercent, 3);
      }

      drawPlayer(player.x, player.y);
      ctx.restore();
      updateUI();
    }

    function updateUI() {
      document.getElementById('hp').innerText = player.hp;
      document.getElementById('atk').innerText = player.atk;
      document.getElementById('gold').innerText = player.gold;
      document.getElementById('hasKey').innerText = player.hasKey ? "Yes" : "No";
      document.getElementById('hasKey').style.color = player.hasKey ? "#00ff00" : "#ff3333";
    }

    function doTurn(dx, dy, action = null) {
      if (gameState !== 'PLAYING') return;
      let map = maps[currentMap];

      if (action === 'rest') {
        if (map.enemy && map.enemy.alive) {
          showMessage("You cannot rest while enemies are nearby!", 'ok');
          return;
        }
        player.hp = Math.min(player.maxHp, player.hp + 2);
        endTurn();
        return;
      }

      if (action === 'wait' || (dx === 0 && dy === 0)) {
        endTurn();
        return;
      }

      let targetX = player.x + dx;
      let targetY = player.y + dy;

      if (isWall(targetX, targetY)) return;

      // --- NPC (SHOP) ---
      if (map.npc && targetX === map.npc.x && targetY === map.npc.y) {
        if (map.npc.type === 'shop') {
          showShop();
        } else {
          showMessage(map.npc.text, 'ok');
        }
        return;
      }

      // --- OFFERING TREE ---
      if (map.offeringTree && targetX === map.offeringTree.x && targetY === map.offeringTree.y) {
        if (map.offeringTree.used) { showMessage("The tree is dormant...", 'ok'); return; }
        if (player.atk <= 1) { showMessage("The tree rejects your weakness. Offer a real weapon.", 'ok'); return; }
        
        showMessage("The tree hungers. Offer a weapon (1 ATK) for a random reward?", 'choice', () => {
          player.atk -= 1;
          let goldFound = Math.floor(Math.random() * 20) + 10;
          player.gold += goldFound;
          map.offeringTree.used = true;
          showMessage(`The tree consumes your weapon and drops ${goldFound} Gold!`, 'ok');
          draw();
        });
        return;
      }

      // --- DOORS ---
      if (map.bossDoor && targetX === map.bossDoor.x && targetY === map.bossDoor.y) {
        if (player.hasKey) {
          currentMap = map.bossDoor.target; player.x = map.bossDoor.spawnX; player.y = map.bossDoor.spawnY; draw();
        } else { showMessage("The door is locked. You need a red key.", 'ok'); }
        return;
      }

      let door = map.doors.find(d => d.x === targetX && d.y === targetY);
      if (door) {
        currentMap = door.target; player.x = door.spawnX; player.y = door.spawnY; draw();
        return;
      }

      if (map.exit && targetX === map.exit.x && targetY === map.exit.y) {
        gameState = 'WIN'; showMessage("You cleared the dungeon!", 'ok'); return;
      }

      // --- COMBAT ---
      if (map.enemy && map.enemy.alive && targetX === map.enemy.x && targetY === map.enemy.y) {
        map.enemy.hp -= player.atk;
        shakeTime = 8; 
        if (map.enemy.hp <= 0) {
          map.enemy.alive = false;
          map.drops.push({ x: map.enemy.x, y: map.enemy.y, amount: Math.floor(Math.random() * 15) + 10 }); // Increased gold drop
        }
        endTurn(); 
        return;
      }

      // --- MOVE ---
      player.x = targetX;
      player.y = targetY;

      // --- PICKUP COINS ---
      if (map.drops) {
        let dropIndex = map.drops.findIndex(d => d.x === player.x && d.y === player.y);
        if (dropIndex !== -1) {
          player.gold += map.drops[dropIndex].amount;
          map.drops.splice(dropIndex, 1); 
        }
      }

      // --- PICKUP ITEMS ---
      if (map.loot && map.loot.active && player.x === map.loot.x && player.y === map.loot.y) {
        map.loot.active = false;
        if (map.loot.type === 'key') { player.hasKey = true; showMessage("You found the Boss Key!", 'ok'); }
        else if (map.loot.type === 'hp') { 
          player.hp = Math.min(player.maxHp, player.hp + 5); 
          showMessage("You drank a Health Potion! +5 HP", 'ok'); 
        }
        else { player.atk += 1; showMessage("Found a weapon! ATK +1", 'ok'); }
      }

      endTurn();
    }

    function endTurn() {
      let map = maps[currentMap];
      if (map.enemy && map.enemy.alive) {
        let dx = player.x - map.enemy.x;
        let dy = player.y - map.enemy.y;
        let dist = Math.abs(dx) + Math.abs(dy);

        if (dist <= 7) {
          if (dist === 1) {
            player.hp -= map.enemy.atk;
            shakeTime = 10; 
            if (player.hp <= 0) {
              player.hp = 0; gameState = 'DEAD'; showMessage("You Died", 'ok');
            }
          } else {
            let moveX = 0, moveY = 0;
            if (Math.abs(dx) > Math.abs(dy)) moveX = Math.sign(dx);
            else moveY = Math.sign(dy);

            let nextX = map.enemy.x + moveX, nextY = map.enemy.y + moveY;

            if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
              map.enemy.x = nextX; map.enemy.y = nextY;
            } else {
              moveX = 0; moveY = 0;
              if (Math.abs(dy) > 0) moveY = Math.sign(dy);
              nextX = map.enemy.x + moveX; nextY = map.enemy.y + moveY;
              if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
                map.enemy.x = nextX; map.enemy.y = nextY;
              }
            }
          }
        }
      }
      draw();
    }

    // --- SHOP SYSTEM ---
    function showShop() {
      document.getElementById('msg-title').innerText = "Blacksmith: 'I can fix you up or sharpen your blade.'";
      let actionsDiv = document.getElementById('msg-actions');
      actionsDiv.innerHTML = ''; 

      // Heal Button
      let btnHeal = document.createElement('button');
      btnHeal.className = 'btn-yes';
      btnHeal.innerText = `Heal (10 Gold) [You have ${player.gold}]`;
      btnHeal.onclick = () => {
        if (player.gold >= 10) {
          player.gold -= 10;
          player.hp = player.maxHp;
          updateUI();
          showMessage("The Blacksmith patches your wounds. HP fully restored!", 'ok');
        } else {
          showMessage("You don't have enough gold!", 'ok');
        }
      };

      // Upgrade Button
      let btnUpgrade = document.createElement('button');
      btnUpgrade.className = 'btn-yes';
      btnUpgrade.style.background = '#2196F3';
      btnUpgrade.innerText = `Sharpen Blade (+1 ATK) (25 Gold)`;
      btnUpgrade.onclick = () => {
        if (player.gold >= 25) {
          player.gold -= 25;
          player.atk += 1;
          updateUI();
          showMessage("The Blacksmith sharpens your blade! ATK +1", 'ok');
        } else {
          showMessage("You don't have enough gold!", 'ok');
        }
      };

      // Leave Button
      let btnLeave = document.createElement('button');
      btnLeave.className = 'btn-no';
      btnLeave.innerText = "Leave";
      btnLeave.onclick = () => { document.getElementById('message').style.display = 'none'; };

      actionsDiv.appendChild(btnHeal);
      actionsDiv.appendChild(btnUpgrade);
      actionsDiv.appendChild(btnLeave);

      document.getElementById('message').style.display = 'block';
    }

    function showMessage(text, type = 'ok', confirmCallback = null) {
      document.getElementById('msg-title').innerText = text;
      let actionsDiv = document.getElementById('msg-actions');
      actionsDiv.innerHTML = '';

      if (type === 'ok') {
        let btn = document.createElement('button');
        btn.className = 'btn-ok';
        btn.innerText = text.includes("Died") || text.includes("cleared") ? "Restart" : "Continue";
        btn.onclick = () => { 
          if (btn.innerText === "Restart") restartGame();
          else document.getElementById('message').style.display = 'none'; 
        };
        actionsDiv.appendChild(btn);
      } 
      else if (type === 'choice') {
        let btnYes = document.createElement('button');
        btnYes.className = 'btn-yes'; btnYes.innerText = "Offer";
        btnYes.onclick = () => { document.getElementById('message').style.display = 'none'; confirmCallback(); };

        let btnNo = document.createElement('button');
        btnNo.className = 'btn-no'; btnNo.innerText = "Cancel";
        btnNo.onclick = () => { document.getElementById('message').style.display = 'none'; };

        actionsDiv.appendChild(btnYes);
        actionsDiv.appendChild(btnNo);
      }

      document.getElementById('message').style.display = 'block';
    }

    function restartGame() {
      player = { x: 10, y: 16, hp: 12, maxHp: 12, atk: 2, gold: 0, hasKey: false };
      gameState = 'PLAYING'; currentMap = 'HUB'; buildMaps();
      document.getElementById('message').style.display = 'none'; draw();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') doTurn(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') doTurn(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') doTurn(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') doTurn(1, 0);
      if (e.key === '.') doTurn(0, 0, 'wait');
      if (e.key === 'r') doTurn(0, 0, 'rest');
    });

    buildMaps();
    restartGame();
  </script>
</body>
</html>
