
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE SANCTUM — Roguelike</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    background: #111014;
    color: #e5dfce;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

#game {
    width: 100%;
    max-width: 420px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

header {
    text-align: center;
    padding: 8px;
    border-bottom: 2px solid #39333e;
}

header h1 {
    font-size: 22px;
    letter-spacing: 4px;
    color: #c8a76b;
}

header p {
    font-size: 10px;
    color: #827b8b;
    margin-top: 5px;
    letter-spacing: 2px;
}

#stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 5px;
}

.stat {
    background: #211e25;
    border: 1px solid #403744;
    padding: 8px 3px;
    text-align: center;
}

.stat-label {
    font-size: 9px;
    color: #89818f;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 14px;
    font-weight: bold;
}

#hpValue { color: #e65b62; }
#atkValue { color: #e7ad61; }
#goldValue { color: #e8ce68; }
#depthValue { color: #ae91d9; }

#canvas-container {
    width: 100%;
    aspect-ratio: 1;
    background: #09090b;
    border: 3px solid #514653;
    position: relative;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
}

#location {
    background: #211e25;
    border: 1px solid #403744;
    padding: 8px;
    text-align: center;
    font-size: 11px;
    color: #c5ad8b;
    letter-spacing: 1px;
}

#message {
    min-height: 38px;
    background: #1c1920;
    border: 1px solid #39333e;
    padding: 10px;
    text-align: center;
    font-size: 11px;
    color: #aaa0b1;
}

#controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    width: 190px;
    margin: 0 auto;
}

.control {
    height: 48px;
    background: #302936;
    border: 1px solid #66566e;
    color: #e9dfd1;
    font-size: 20px;
    cursor: pointer;
    border-radius: 3px;
}

.control:active {
    background: #55445e;
}

.control.empty {
    visibility: hidden;
}

#footer {
    text-align: center;
    font-size: 9px;
    color: #625b69;
    letter-spacing: 1px;
}

.overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(8, 7, 11, 0.94);
    z-index: 10;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.overlay-content {
    width: 100%;
    background: #241f29;
    border: 2px solid #806b91;
    padding: 18px;
    text-align: center;
}

.overlay h2 {
    color: #d9b77b;
    margin-bottom: 15px;
    font-size: 18px;
}

.overlay button {
    display: block;
    width: 100%;
    padding: 12px;
    margin-top: 9px;
    background: #393044;
    border: 1px solid #806b91;
    color: #eee3d3;
    font-family: monospace;
    cursor: pointer;
}

.overlay button:active {
    background: #59466b;
}

@media (max-height: 650px) {
    #game {
        gap: 5px;
        padding: 5px;
    }

    header {
        padding: 3px;
    }

    header h1 {
        font-size: 17px;
    }

    .control {
        height: 38px;
    }
}
</style>
</head>

<body>

<div id="game">

    <header>
        <h1>THE SANCTUM</h1>
        <p>DESCENT INTO THE UNKNOWN</p>
    </header>

    <section id="stats">
        <div class="stat">
            <div class="stat-label">HP</div>
            <div class="stat-value" id="hpValue">20/20</div>
        </div>

        <div class="stat">
            <div class="stat-label">ATK</div>
            <div class="stat-value" id="atkValue">3</div>
        </div>

        <div class="stat">
            <div class="stat-label">GOLD</div>
            <div class="stat-value" id="goldValue">0</div>
        </div>

        <div class="stat">
            <div class="stat-label">DEPTH</div>
            <div class="stat-value" id="depthValue">1</div>
        </div>
    </section>

    <div id="canvas-container">

        <canvas id="gameCanvas" width="320" height="320"></canvas>

        <div class="overlay" id="shopOverlay">
            <div class="overlay-content" id="shopContent"></div>
        </div>

        <div class="overlay" id="altarOverlay">
            <div class="overlay-content" id="altarContent"></div>
        </div>

        <div class="overlay" id="messageOverlay">
            <div class="overlay-content" id="messageContent"></div>
        </div>

    </div>

    <div id="location">THE SANCTUM</div>

    <div id="message">
        A quiet place before the descent...
    </div>

    <div id="controls">
        <button class="control empty"></button>
        <button class="control" onclick="doTurn(0,-1)">▲</button>
        <button class="control empty"></button>

        <button class="control" onclick="doTurn(-1,0)">◀</button>
        <button class="control" onclick="doTurn(0,1)">▼</button>
        <button class="control" onclick="doTurn(1,0)">▶</button>
    </div>

    <div id="footer">
        EVERY DESCENT HAS A PRICE
    </div>

</div>

<script>

// =====================================================
// 1. CANVAS SETUP
// =====================================================

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const TILE = 16;
const MAP_SIZE = 20;

ctx.imageSmoothingEnabled = false;


// =====================================================
// 2. GAME CONSTANTS
// =====================================================

const TILE_TYPES = {
    VOID: 0,
    FLOOR: 1,
    WALL: 2,
    DOOR: 3,
    PURPLE_DOOR: 4,
    BOSS_DOOR: 5,
    ALTAR: 6,
    VAULT: 7,
    BLACKSMITH: 8,
    TREE: 9,
    RUIN: 10,
    PORTAL: 11
};

const ROOM_TYPES = [
    "Blacksmith",
    "Offering Tree",
    "Abandoned Ruin"
];

const COLORS = {
    background: "#09090c",
    floor: "#39313b",
    wall: "#625362",
    wallDark: "#352d38",
    player: "#e4d4a4",
    goblin: "#83a65c",
    tinman: "#9babb5",
    boss: "#c34c55",
    gold: "#eac75b",
    purple: "#a46bd1"
};


// =====================================================
// 3. SAVE SYSTEM
// =====================================================

const DEFAULT_SAVE = {
    permanentGold: 0,
    bonusMaxHp: 0,
    bonusAtk: 0
};

function loadSave() {
    try {
        const stored = localStorage.getItem("sanctum_save");

        if (!stored) {
            return { ...DEFAULT_SAVE };
        }

        const parsed = JSON.parse(stored);

        return {
            permanentGold: Math.max(
                0, Number(parsed.permanentGold) || 0
            ),
            bonusMaxHp: Math.max(
                0, Number(parsed.bonusMaxHp) || 0
            ),
            bonusAtk: Math.max(
                0, Number(parsed.bonusAtk) || 0
            )
        };

    } catch (error) {
        console.error("Save loading failed:", error);
        return { ...DEFAULT_SAVE };
    }
}

let saveData = loadSave();

function saveGame() {
    try {
        localStorage.setItem(
            "sanctum_save",
            JSON.stringify(saveData)
        );
    } catch (error) {
        console.error("Save failed:", error);
    }
}


// =====================================================
// 4. PLAYER INITIALIZATION
// =====================================================

const player = {
    x: 10,
    y: 10,

    hp: 20 + saveData.bonusMaxHp,
    maxHp: 20 + saveData.bonusMaxHp,

    atk: 3 + saveData.bonusAtk,

    gold: 0,
    key: false,

    alive: true
};


// =====================================================
// 5. WORLD STATE
// =====================================================

let currentDepth = 1;

let currentArea = "sanctum";

let map = [];

let enemies = [];

let coins = [];

let rooms = [];

let floorFlags = {
    treeUsed: false,
    bossDefeated: false,
    keySpawned: false,
    keyCollected: false
};

let boss = null;


// =====================================================
// 6. RANDOM HELPERS
// =====================================================

function randomInt(min, max) {
    return Math.floor(
        Math.random() * (max - min + 1)
    ) + min;
}

function shuffle(array) {
    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {
        const j = randomInt(0, i);

        [result[i], result[j]] =
            [result[j], result[i]];
    }

    return result;
}

function distance(x1, y1, x2, y2) {
    return Math.abs(x1 - x2) +
           Math.abs(y1 - y2);
}


// =====================================================
// 7. MAP GENERATION HELPERS
// =====================================================

function createEmptyMap() {
    return Array.from(
        { length: MAP_SIZE },
        () => Array(MAP_SIZE).fill(TILE_TYPES.WALL)
    );
}

function carveRoom(x, y, width, height) {

    for (let row = y; row < y + height; row++) {
        for (let col = x; col < x + width; col++) {

            if (
                row >= 0 &&
                row < MAP_SIZE &&
                col >= 0 &&
                col < MAP_SIZE
            ) {
                map[row][col] = TILE_TYPES.FLOOR;
            }
        }
    }
}

function carveCorridor(x1, y1, x2, y2) {

    let x = x1;
    let y = y1;

    while (x !== x2) {
        map[y][x] = TILE_TYPES.FLOOR;
        x += Math.sign(x2 - x);
    }

    while (y !== y2) {
        map[y][x] = TILE_TYPES.FLOOR;
        y += Math.sign(y2 - y);
    }

    map[y][x] = TILE_TYPES.FLOOR;
}

function placeTile(x, y, type) {

    if (
        x >= 0 && x < MAP_SIZE &&
        y >= 0 && y < MAP_SIZE
    ) {
        map[y][x] = type;
    }
}


// =====================================================
// 8. SANCTUM GENERATION
// =====================================================

function generateSanctum() {

    map = createEmptyMap();

    enemies = [];
    coins = [];
    rooms = [];

    // Main sanctuary chamber
    carveRoom(6, 6, 8, 8);

    // Player spawn
    player.x = 10;
    player.y = 10;

    // Permanent upgrade altar
    placeTile(8, 8, TILE_TYPES.ALTAR);

    // Gold vault
    placeTile(12, 8, TILE_TYPES.VAULT);

    // Purple dungeon entrance
    placeTile(10, 13, TILE_TYPES.PURPLE_DOOR);

    currentArea = "sanctum";

    updateLocation();
}


// =====================================================
// 9. RANDOMIZED DUNGEON ROOMS
// =====================================================

function generateDungeonRooms() {

    const roomPositions = [
        { x: 2, y: 2, w: 5, h: 5 },
        { x: 13, y: 2, w: 5, h: 5 },
        { x: 2, y: 13, w: 5, h: 5 },
        { x: 13, y: 13, w: 5, h: 5 }
    ];

    const selectedPositions = shuffle(roomPositions).slice(0, 3);

    const selectedTypes = shuffle(ROOM_TYPES);

    rooms = [];

    for (let i = 0; i < 3; i++) {

        const pos = selectedPositions[i];

        const room = {
            x: pos.x,
            y: pos.y,
            w: pos.w,
            h: pos.h,
            type: selectedTypes[i]
        };

        carveRoom(
            room.x,
            room.y,
            room.w,
            room.h
        );

        rooms.push(room);
    }

    // Connect rooms through the central courtyard
    const centerX = 10;
    const centerY = 10;

    rooms.forEach(room => {

        const roomCenterX =
            room.x + Math.floor(room.w / 2);

        const roomCenterY =
            room.y + Math.floor(room.h / 2);

        carveCorridor(
            centerX,
            centerY,
            roomCenterX,
            roomCenterY
        );

        // Room entrance
        placeTile(
            roomCenterX,
            roomCenterY,
            TILE_TYPES.DOOR
        );
    });

    return rooms;
}


// =====================================================
// 10. ROOM SPECIAL OBJECTS
// =====================================================

function placeRoomObjects() {

    rooms.forEach(room => {

        const centerX =
            room.x + Math.floor(room.w / 2);

        const centerY =
            room.y + Math.floor(room.h / 2);

        switch (room.type) {

            case "Blacksmith":

                placeTile(
                    centerX,
                    centerY - 1,
                    TILE_TYPES.BLACKSMITH
                );

                break;

            case "Offering Tree":

                placeTile(
                    centerX,
                    centerY - 1,
                    TILE_TYPES.TREE
                );

                break;

            case "Abandoned Ruin":

                placeTile(
                    centerX,
                    centerY - 1,
                    TILE_TYPES.RUIN
                );

                break;
        }
    });
}


// =====================================================
// 11. COURTYARD GENERATION
// =====================================================

function generateCourtyard() {

    map = createEmptyMap();

    enemies = [];
    coins = [];
    rooms = [];

    // Large central courtyard
    carveRoom(6, 6, 8, 8);

    // Dungeon entry
    placeTile(10, 13, TILE_TYPES.DOOR);

    // Boss entrance
    placeTile(10, 6, TILE_TYPES.BOSS_DOOR);

    // Generate the three randomized rooms
    generateDungeonRooms();

    placeRoomObjects();

    // Player enters courtyard
    player.x = 10;
    player.y = 12;

    currentArea = "courtyard";

    floorFlags = {
        treeUsed: false,
        bossDefeated: false,
        keySpawned: false,
        keyCollected: false
    };

    spawnEnemies();

    updateLocation();
}


// =====================================================
// 12. ENEMY SCALING
// =====================================================

function getEnemyStats(type) {

    const depth = currentDepth - 1;

    switch (type) {

        case "goblin":

            return {
                hp: 5 + depth * 2,
                atk: 2 + Math.floor(depth * 0.7)
            };

        case "tinman":

            return {
                hp: 12 + depth * 3,
                atk: 3 + Math.floor(depth * 1.2)
            };

        case "boss":

            return {
                hp: 35 + depth * 10,
                atk: 5 + depth * 2
            };

        default:

            return {
                hp: 5,
                atk: 1
            };
    }
}


// =====================================================
// 13. ENEMY SPAWNING
// =====================================================

function isValidSpawn(x, y) {

    if (isWall(x, y)) return false;

    if (
        Math.abs(player.x - x) +
        Math.abs(player.y - y) < 4
    ) {
        return false;
    }

    if (enemies.some(e => e.x === x && e.y === y)) {
        return false;
    }

    if (coins.some(c => c.x === x && c.y === y)) {
        return false;
    }

    return true;
}

function spawnEnemy(type, x, y) {

    const stats = getEnemyStats(type);

    enemies.push({
        type,
        x,
        y,
        hp: stats.hp,
        maxHp: stats.hp,
        atk: stats.atk,
        alive: true
    });
}

function spawnEnemies() {

    enemies = [];

    const goblinCount = Math.min(
        2 + currentDepth,
        10
    );

    const tinmanCount = Math.min(
        Math.floor(currentDepth / 2),
        5
    );

    function spawnRandom(type, count) {

        let spawned = 0;
        let attempts = 0;

        while (
            spawned < count &&
            attempts < 200
        ) {

            attempts++;

            const x = randomInt(1, MAP_SIZE - 2);
            const y = randomInt(1, MAP_SIZE - 2);

            if (isValidSpawn(x, y)) {

                spawnEnemy(type, x, y);

                spawned++;
            }
        }
    }

    spawnRandom("goblin", goblinCount);
    spawnRandom("tinman", tinmanCount);
}


// =====================================================
// 14. WALL COLLISION CHECK
// =====================================================

function isWall(x, y) {

    if (
        x < 0 ||
        x >= MAP_SIZE ||
        y < 0 ||
        y >= MAP_SIZE
    ) {
        return true;
    }

    const tile = map[y][x];

    return (
        tile === TILE_TYPES.WALL ||
        tile === TILE_TYPES.VOID
    );
}


// =====================================================
// 15. PIXEL DRAWING HELPERS
// =====================================================

function fillRect(x, y, width, height, color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        x * TILE,
        y * TILE,
        width,
        height
    );
}

function drawPixel(x, y, color) {

    ctx.fillStyle = color;

    ctx.fillRect(
        x,
        y,
        1,
        1
    );
}


// =====================================================
// 16. DRAW FLOOR AND WALLS
// =====================================================

function drawFloor(x, y) {

    fillRect(x, y, 1, 1, COLORS.floor);

    ctx.fillStyle = "#453b48";

    ctx.fillRect(
        x * TILE + 2,
        y * TILE + 2,
        12,
        12
    );

    ctx.fillStyle = "#39313b";

    ctx.fillRect(
        x * TILE + 3,
        y * TILE + 3,
        10,
        10
    );
}

function drawWall(x, y) {

    fillRect(x, y, 1, 1, COLORS.wallDark);

    ctx.fillStyle = COLORS.wall;

    ctx.fillRect(
        x * TILE,
        y * TILE,
        16,
        13
    );

    ctx.fillStyle = "#756477";

    ctx.fillRect(
        x * TILE,
        y * TILE,
        16,
        3
    );

    ctx.fillStyle = "#28232c";

    ctx.fillRect(
        x * TILE,
        y * TILE + 13,
        16,
        3
    );
}


// =====================================================
// 17. DRAW DOORS
// =====================================================

function drawDoor(x, y, type) {

    const px = x * TILE;
    const py = y * TILE;

    ctx.fillStyle = "#241e27";

    ctx.fillRect(px + 2, py + 2, 12, 14);

    if (type === TILE_TYPES.PURPLE_DOOR) {

        ctx.fillStyle = COLORS.purple;

        ctx.fillRect(px + 4, py + 3, 8, 13);

        ctx.fillStyle = "#d5a7ff";

        ctx.fillRect(px + 6, py + 5, 4, 8);

    } else if (type === TILE_TYPES.BOSS_DOOR) {

        ctx.fillStyle = "#8d353e";

        ctx.fillRect(px + 4, py + 3, 8, 13);

        ctx.fillStyle = "#e0a24e";

        ctx.fillRect(px + 6, py + 6, 4, 4);

    } else {

        ctx.fillStyle = "#a17a4d";

        ctx.fillRect(px + 4, py + 3, 8, 13);

        ctx.fillStyle = "#d6b16d";

        ctx.fillRect(px + 10, py + 8, 2, 2);
    }
}


// =====================================================
// 18. DRAW ALTAR, VAULT AND ROOM OBJECTS
// =====================================================

function drawSpecialTile(x, y, type) {

    const px = x * TILE;
    const py = y * TILE;

    if (type === TILE_TYPES.ALTAR) {

        ctx.fillStyle = "#51405f";
        ctx.fillRect(px + 3, py + 5, 10, 9);

        ctx.fillStyle = "#b78ae3";
        ctx.fillRect(px + 5, py + 2, 6, 6);

        ctx.fillStyle = "#e1c5ff";
        ctx.fillRect(px + 7, py + 4, 2, 2);

    } else if (type === TILE_TYPES.VAULT) {

        ctx.fillStyle = "#886331";
        ctx.fillRect(px + 2, py + 5, 12, 9);

        ctx.fillStyle = "#d4ad52";
        ctx.fillRect(px + 3, py + 6, 10, 2);

        ctx.fillStyle = "#f1d27a";
        ctx.fillRect(px + 7, py + 9, 2, 3);

    } else if (type === TILE_TYPES.BLACKSMITH) {

        ctx.fillStyle = "#56535b";
        ctx.fillRect(px + 3, py + 5, 10, 9);

        ctx.fillStyle = "#c17b43";
        ctx.fillRect(px + 5, py + 2, 6, 5);

        ctx.fillStyle = "#e3a35b";
        ctx.fillRect(px + 7, py + 3, 3, 3);

    } else if (type === TILE_TYPES.TREE) {

        ctx.fillStyle = "#694b36";
        ctx.fillRect(px + 7, py + 8, 3, 7);

        ctx.fillStyle = "#467b48";
        ctx.fillRect(px + 3, py + 2, 10, 8);

        ctx.fillStyle = "#a1c16a";
        ctx.fillRect(px + 6, py + 3, 4, 3);

    } else if (type === TILE_TYPES.RUIN) {

        ctx.fillStyle = "#77717b";
        ctx.fillRect(px + 3, py + 4, 10, 10);

        ctx.fillStyle = "#aaa1ad";
        ctx.fillRect(px + 5, py + 2, 6, 4);

        ctx.fillStyle = "#38313c";
        ctx.fillRect(px + 6, py + 7, 4, 5);
    }
}


// =====================================================
// 19. DRAW PLAYER
// =====================================================

function drawPlayer() {

    const px = player.x * TILE;
    const py = player.y * TILE;

    // Shadow
    ctx.fillStyle = "#17131b";
    ctx.fillRect(px + 3, py + 13, 10, 2);

    // Legs
    ctx.fillStyle = "#51434b";
    ctx.fillRect(px + 5, py + 10, 3, 5);
    ctx.fillRect(px + 9, py + 10, 3, 5);

    // Body
    ctx.fillStyle = "#82705e";
    ctx.fillRect(px + 4, py + 6, 8, 6);

    // Head
    ctx.fillStyle = COLORS.player;
    ctx.fillRect(px + 5, py + 2, 7, 6);

    // Helmet
    ctx.fillStyle = "#a58c6d";
    ctx.fillRect(px + 4, py + 1, 9, 3);

    // Eyes
    ctx.fillStyle = "#352d30";
    ctx.fillRect(px + 6, py + 5, 1, 1);
    ctx.fillRect(px + 10, py + 5, 1, 1);
}


// =====================================================
// 20. DRAW GOBLIN
// =====================================================

function drawGoblin(enemy) {

    const px = enemy.x * TILE;
    const py = enemy.y * TILE;

    ctx.fillStyle = "#17151a";
    ctx.fillRect(px + 3, py + 13, 10, 2);

    ctx.fillStyle = "#49613a";
    ctx.fillRect(px + 4, py + 7, 8, 7);

    ctx.fillStyle = COLORS.goblin;
    ctx.fillRect(px + 4, py + 3, 8, 6);

    // Ears
    ctx.fillRect(px + 1, py + 5, 4, 3);
    ctx.fillRect(px + 11, py + 5, 4, 3);

    // Eyes
    ctx.fillStyle = "#e9d75d";
    ctx.fillRect(px + 6, py + 5, 2, 2);
    ctx.fillRect(px + 10, py + 5, 2, 2);
}


// =====================================================
// 21. DRAW TIN MAN
// =====================================================

function drawTinMan(enemy) {

    const px = enemy.x * TILE;
    const py = enemy.y * TILE;

    ctx.fillStyle = "#17151a";
    ctx.fillRect(px + 2, py + 13, 12, 2);

    // Legs
    ctx.fillStyle = "#697983";
    ctx.fillRect(px + 4, py + 10, 3, 5);
    ctx.fillRect(px + 9, py + 10, 3, 5);

    // Body
    ctx.fillStyle = COLORS.tinman;
    ctx.fillRect(px + 3, py + 6, 10, 7);

    // Head
    ctx.fillStyle = "#bdc8ce";
    ctx.fillRect(px + 4, py + 2, 8, 6);

    // Eyes
    ctx.fillStyle = "#d15b53";
    ctx.fillRect(px + 6, py + 5, 2, 2);
    ctx.fillRect(px + 10, py + 5, 2, 2);
}


// =====================================================
// 22. DRAW BOSS
// =====================================================

function drawBoss(enemy) {

    const px = enemy.x * TILE;
    const py = enemy.y * TILE;

    // Shadow
    ctx.fillStyle = "#171018";
    ctx.fillRect(px + 1, py + 14, 14, 2);

    // Body
    ctx.fillStyle = "#702b39";
    ctx.fillRect(px + 2, py + 6, 12, 9);

    // Armor
    ctx.fillStyle = COLORS.boss;
    ctx.fillRect(px + 3, py + 4, 10, 8);

    // Head
    ctx.fillStyle = "#a83f4b";
    ctx.fillRect(px + 4, py + 1, 8, 7);

    // Horns
    ctx.fillStyle = "#d0a15c";
    ctx.fillRect(px + 1, py, 3, 5);
    ctx.fillRect(px + 12, py, 3, 5);

    // Eyes
    ctx.fillStyle = "#ffe18b";
    ctx.fillRect(px + 5, py + 4, 2, 2);
    ctx.fillRect(px + 10, py + 4, 2, 2);
}


// =====================================================
// 23. DRAW GOLD COINS
// =====================================================

function drawCoin(coin) {

    const px = coin.x * TILE;
    const py = coin.y * TILE;

    ctx.fillStyle = "#9b742b";
    ctx.fillRect(px + 5, py + 5, 7, 7);

    ctx.fillStyle = COLORS.gold;
    ctx.fillRect(px + 6, py + 4, 5, 8);

    ctx.fillStyle = "#fff0a4";
    ctx.fillRect(px + 7, py + 5, 2, 3);
}


// =====================================================
// 24. DRAW MAP
// =====================================================

function drawMap() {

    for (let y = 0; y < MAP_SIZE; y++) {

        for (let x = 0; x < MAP_SIZE; x++) {

            const type = map[y][x];

            if (type === TILE_TYPES.WALL) {

                drawWall(x, y);

            } else {

                drawFloor(x, y);

                if (
                    type === TILE_TYPES.DOOR ||
                    type === TILE_TYPES.PURPLE_DOOR ||
                    type === TILE_TYPES.BOSS_DOOR
                ) {
                    drawDoor(x, y, type);
                }

                if (
                    type >= TILE_TYPES.ALTAR &&
                    type <= TILE_TYPES.RUIN
                ) {
                    drawSpecialTile(x, y, type);
                }

                if (type === TILE_TYPES.PORTAL) {

                    ctx.fillStyle = "#7543a3";
                    ctx.fillRect(
                        x * TILE + 2,
                        y * TILE + 2,
                        12,
                        12
                    );

                    ctx.fillStyle = "#d3a5ff";
                    ctx.fillRect(
                        x * TILE + 5,
                        y * TILE + 5,
                        6,
                        6
                    );
                }
            }
        }
    }
}


// =====================================================
// 25. DRAW ENTITIES
// =====================================================

function drawEntities() {

    coins.forEach(coin => {
        if (!coin.collected) {
            drawCoin(coin);
        }
    });

    enemies.forEach(enemy => {

        if (!enemy.alive) return;

        if (enemy.type === "goblin") {
            drawGoblin(enemy);
        }

        if (enemy.type === "tinman") {
            drawTinMan(enemy);
        }

        if (enemy.type === "boss") {
            drawBoss(enemy);
        }
    });

    if (player.alive) {
        drawPlayer();
    }
}


// =====================================================
// 26. MAIN RENDER FUNCTION
// =====================================================

function render() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.fillStyle = COLORS.background;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawMap();

    drawEntities();
}

// =====================================================
// 28. TURN SYSTEM
// =====================================================

let gameOver = false;
let turnCount = 0;

function doTurn(dx, dy) {

    if (!player.alive || gameOver) return;

    // Prevent movement while an overlay is open
    if (
        document.getElementById("shopOverlay").style.display === "flex" ||
        document.getElementById("altarOverlay").style.display === "flex" ||
        document.getElementById("messageOverlay").style.display === "flex"
    ) return;

    const nx = player.x + dx;
    const ny = player.y + dy;

    // Check for enemies in the target position
    const targetEnemy = enemies.find(e =>
        e.alive && e.x === nx && e.y === ny
    );

    if (targetEnemy) {

        attackEnemy(targetEnemy);

        endTurn();
        return;
    }

    if (isWall(nx, ny)) return;

    const tile = map[ny][nx];

    // ---------------------------------------------
    // INTERACTION: SANCTUM ENTRANCE
    // ---------------------------------------------

    if (tile === TILE_TYPES.PURPLE_DOOR) {

        showText("You descend into the courtyard...");

        generateCourtyard();

        updateStats();
        render();

        return;
    }

    // ---------------------------------------------
    // INTERACTION: ALTAR
    // ---------------------------------------------

    if (tile === TILE_TYPES.ALTAR) {

        showAltar();
        return;
    }

    // ---------------------------------------------
    // INTERACTION: VAULT
    // ---------------------------------------------

    if (tile === TILE_TYPES.VAULT) {

        showText(
            "The vault contains " +
            saveData.permanentGold +
            " permanent gold."
        );

        return;
    }

    // ---------------------------------------------
    // INTERACTION: BLACKSMITH
    // ---------------------------------------------

    if (tile === TILE_TYPES.BLACKSMITH) {

        showShop();
        return;
    }

    // ---------------------------------------------
    // INTERACTION: OFFERING TREE
    // ---------------------------------------------

    if (tile === TILE_TYPES.TREE) {

        showTree();
        return;
    }

    // ---------------------------------------------
    // INTERACTION: ABANDONED RUIN
    // ---------------------------------------------

    if (tile === TILE_TYPES.RUIN) {

        showRuin();
        return;
    }

    // ---------------------------------------------
    // INTERACTION: BOSS DOOR
    // ---------------------------------------------

    if (tile === TILE_TYPES.BOSS_DOOR) {

        if (!floorFlags.keyCollected) {

            showText("The boss door is sealed. Find its key!");

            return;
        }

        enterBossChamber();
        return;
    }

    // ---------------------------------------------
    // INTERACTION: BOSS PORTAL
    // ---------------------------------------------

    if (tile === TILE_TYPES.PORTAL) {

        nextFloor();
        return;
    }

    // ---------------------------------------------
    // NORMAL MOVEMENT
    // ---------------------------------------------

    player.x = nx;
    player.y = ny;

    // Pick up coins by walking over them
    collectCoins();

    // Pick up key
    collectKey();

    turnCount++;

    endTurn();
}


// =====================================================
// 29. COMBAT
// =====================================================

function attackEnemy(enemy) {

    const damage = player.atk;

    enemy.hp -= damage;

    showText(
        "You hit the " +
        enemy.type +
        " for " +
        damage +
        " damage!"
    );

    if (enemy.hp <= 0) {

        enemy.alive = false;

        showText(
            "The " + enemy.type + " has been defeated!"
        );

        dropGold(enemy);

        if (enemy.type === "boss") {
            defeatBoss();
        }
    }

    render();
}

function dropGold(enemy) {

    let amount;

    if (enemy.type === "goblin") {
        amount = randomInt(2, 5);
    }

    else if (enemy.type === "tinman") {
        amount = randomInt(4, 9);
    }

    else {
        amount = randomInt(15, 30);
    }

    coins.push({
        x: enemy.x,
        y: enemy.y,
        amount,
        collected: false
    });
}


// =====================================================
// 30. COIN COLLECTION
// =====================================================

function collectCoins() {

    coins.forEach(coin => {

        if (
            !coin.collected &&
            coin.x === player.x &&
            coin.y === player.y
        ) {

            coin.collected = true;

            player.gold += coin.amount;

            showText(
                "Collected " + coin.amount + " gold!"
            );
        }
    });

    updateStats();
}

function collectKey() {

    if (
        keyItem &&
        !keyItem.collected &&
        player.x === keyItem.x &&
        player.y === keyItem.y
    ) {

        keyItem.collected = true;

        floorFlags.keyCollected = true;

        showText("You found the Boss Key!");

        updateStats();
    }
}


// =====================================================
// 31. ENEMY AI
// =====================================================

function endTurn() {

    if (!player.alive || gameOver) return;

    enemies.forEach(enemy => {

        if (!enemy.alive) return;

        const dist = distance(
            enemy.x,
            enemy.y,
            player.x,
            player.y
        );

        // Attack when adjacent
        if (dist === 1) {

            player.hp -= enemy.atk;

            showText(
                "The " +
                enemy.type +
                " attacks for " +
                enemy.atk +
                " damage!"
            );

            return;
        }

        // Chase the player
        if (dist <= 8) {

            moveEnemy(enemy);
        }
    });

    updateStats();

    if (player.hp <= 0) {
        player.hp = 0;
        defeatPlayer();
    }

    render();
}

function moveEnemy(enemy) {

    const directions = shuffle([
        { x: 0, y: -1 },
        { x: 0, y: 1 },
        { x: -1, y: 0 },
        { x: 1, y: 0 }
    ]);

    let bestMove = null;
    let bestDistance = distance(
        enemy.x,
        enemy.y,
        player.x,
        player.y
    );

    directions.forEach(dir => {

        const nx = enemy.x + dir.x;
        const ny = enemy.y + dir.y;

        if (isWall(nx, ny)) return;

        if (nx === player.x && ny === player.y) return;

        const occupied = enemies.some(other =>
            other !== enemy &&
            other.alive &&
            other.x === nx &&
            other.y === ny
        );

        if (occupied) return;

        const newDistance = distance(
            nx,
            ny,
            player.x,
            player.y
        );

        if (newDistance < bestDistance) {

            bestDistance = newDistance;

            bestMove = {
                x: nx,
                y: ny
            };
        }
    });

    if (bestMove) {

        enemy.x = bestMove.x;
        enemy.y = bestMove.y;
    }
}

        </button>
    `;

function closeShop() {

    document.getElementById("shopOverlay").style.display = "none";

    render();
}

function buyHealing() {

    const cost = 5 + currentDepth * 2;

    if (player.gold < cost) {

        showText("Not enough gold!");
        return;
    }

    if (player.hp >= player.maxHp) {

        showText("Your HP is already full!");
        return;
    }

    player.gold -= cost;

    player.hp = Math.min(
        player.maxHp,
        player.hp + 10
    );

    updateStats();

    showText("The blacksmith restores your health.");

    closeShop();
}

function buyAttack() {

    const cost = 15 + currentDepth * 5;

    if (player.gold < cost) {

        showText("Not enough gold!");
        return;
    }

    player.gold -= cost;
    player.atk++;

    updateStats();

    showText("Your weapon has been upgraded!");

    closeShop();
}

// 36. KEY SYSTEM
// =====================================================

let keyItem = null;

function revealKey() {

    if (!keyItem) {

        const ruin = rooms.find(
            room => room.type === "Abandoned Ruin"
        );

        if (!ruin) return;

        const x = ruin.x + Math.floor(ruin.w / 2);
        const y = ruin.y + Math.floor(ruin.h / 2) - 1;

        keyItem = {
            x,
            y,
            collected: false
        };
    }

    closeMessage();

    showText("The key has appeared inside the ruin!");

    render();
}

function drawKey() {

    if (!keyItem || keyItem.collected) return;

    const px = keyItem.x * TILE;
    const py = keyItem.y * TILE;

    ctx.fillStyle = "#f1d66d";

    ctx.fillRect(px + 5, py + 4, 6, 3);
    ctx.fillRect(px + 9, py + 5, 2, 6);
    ctx.fillRect(px + 8, py + 10, 4, 2);

    ctx.fillStyle = "#fff1a8";

    ctx.fillRect(px + 6, py + 5, 3, 1);
}

document.addEventListener("keydown", event => {

    const keys = {
        ArrowUp: [0, -1],
        ArrowDown: [0, 1],
        ArrowLeft: [-1, 0],
        ArrowRight: [1, 0],
        w: [0, -1],
        s: [0, 1],
        a: [-1, 0],
        d: [1, 0]
    };

    if (keys[event.key]) {

        event.preventDefault();

        const [dx, dy] = keys[event.key];

        doTurn(dx, dy);
    }
});


// =====================================================
// 45. MOBILE TOUCH SUPPORT
// =====================================================

let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener("touchstart", event => {

    const touch = event.touches[0];

    touchStartX = touch.clientX;
    touchStartY = touch.clientY;

}, { passive: true });

canvas.addEventListener("touchend", event => {

    const touch = event.changedTouches[0];

    const dx = touch.clientX - touchStartX;
    const dy = touch.clientY - touchStartY;

    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) {
        return;
    }

    if (Math.abs(dx) > Math.abs(dy)) {

        doTurn(dx > 0 ? 1 : -1, 0);

    } else {

        doTurn(0, dy > 0 ? 1 : -1);
    }

}, { passive: true });
