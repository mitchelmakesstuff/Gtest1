<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Caves - Stage 12</title>
<style>
:root{
  --bg:#120e1a; --panel:#1d1728; --line:#3a2f52; --ink:#e8e0f4; --dim:#8f84a8;
  --hp:#e0475b; --atk:#f0a040; --gold:#f5d142; --depth:#7fb4ff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Courier New",Courier,monospace;-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
#game{width:min(94vw,560px)}

/* HUD */
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.stat{background:var(--panel);border:2px solid var(--line);padding:5px 8px;line-height:1.25}
.stat small{display:block;color:var(--dim);font-size:11px}
.stat b{font-size:16px}
#hudHp b{color:var(--hp)} #hudAtk b{color:var(--atk)}
#hudGold b{color:var(--gold)} #hudDepth b{color:var(--depth)}

/* Stage: canvas + overlay (overlay is filled by Part 2) */
#stage{position:relative}
#screen{display:block;width:100%;aspect-ratio:1/1;background:#000;border:2px solid var(--line);
  image-rendering:crisp-edges;image-rendering:pixelated}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(10,6,16,.82);padding:14px}
#overlay.open{display:flex}
#panel{width:100%;max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);
  padding:14px;text-align:center;line-height:1.4}
#panel h2{margin:0 0 8px;font-size:18px;color:var(--gold)}
#panel p{margin:0 0 10px;font-size:14px}
#panel button,.dpad button{font:inherit;color:var(--ink);background:#2a2140;border:2px solid var(--line);
  padding:8px 12px;margin:4px;cursor:pointer}
#panel button:hover,#panel button:focus-visible,.dpad button:active{background:#3c2f5c;outline:none}
#panel button:disabled{opacity:.4;cursor:not-allowed}

#log{min-height:22px;margin-top:8px;font-size:13px;color:var(--dim);text-align:center}

/* On-screen pad (wired up in Part 2) */
.dpad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);gap:2px;margin-top:4px}
.dpad button{margin:0;padding:0;font-size:18px}
.dpad [data-dir="up"]{grid-area:1/2} .dpad [data-dir="left"]{grid-area:2/1}
.dpad [data-dir="wait"]{grid-area:2/2} .dpad [data-dir="right"]{grid-area:2/3}
.dpad [data-dir="down"]{grid-area:3/2}
@media (hover:hover) and (pointer:fine){.dpad{display:none}}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="stat" id="hudHp"><small>HP</small><b>0/0</b></div>
    <div class="stat" id="hudAtk"><small>ATK</small><b>0</b></div>
    <div class="stat" id="hudGold"><small>Gold</small><b>0</b></div>
    <div class="stat" id="hudDepth"><small>Depth</small><b>0</b></div>
  </div>
  <div id="stage">
    <canvas id="screen" width="320" height="320"></canvas>
    <div id="overlay"><div id="panel"></div></div>
  </div>
  <div id="log"></div>
</div>
<div class="dpad" id="dpad">
  <button data-dir="up" aria-label="Up">&#9650;</button>
  <button data-dir="left" aria-label="Left">&#9664;</button>
  <button data-dir="wait" aria-label="Wait">&#8226;</button>
  <button data-dir="right" aria-label="Right">&#9654;</button>
  <button data-dir="down" aria-label="Down">&#9660;</button>
</div>

<script>
'use strict';
/* =====================================================================
   CAVES - Stage 12  |  PART 1: setup, save, map generation, drawing
   ===================================================================== */

/* ---------- 1. Canvas setup (320x320, 20x20 tiles of 16px) ---------- */
const TILE = 16, GRID = 20;
const canvas = document.getElementById('screen');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

/* ---------- 2. UI (HUD) ---------- */
const ui = {
  hp:    document.querySelector('#hudHp b'),
  atk:   document.querySelector('#hudAtk b'),
  gold:  document.querySelector('#hudGold b'),
  depth: document.querySelector('#hudDepth b'),
  log:   document.getElementById('log'),
};

function updateHUD() {
  ui.hp.textContent    = player.hp + '/' + player.maxHp;
  ui.atk.textContent   = player.atk;
  ui.gold.textContent  = player.gold;
  ui.depth.textContent = area === 'sanctum' ? 'Sanctum' : currentDepth;
}
function setLog(text) { ui.log.textContent = text || ''; }

/* ---------- 3. Save system (localStorage) ---------- */
const SAVE_KEY = 'caves_stage12_save';
const DEFAULT_SAVE = { permanentGold: 0, bonusMaxHp: 0, bonusAtk: 0 };

function loadSave() {
  const data = Object.assign({}, DEFAULT_SAVE);
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      for (const k in DEFAULT_SAVE) {
        const n = Number(parsed[k]);
        data[k] = Number.isFinite(n) && n >= 0 ? Math.floor(n) : 0;
      }
    }
  } catch (e) { /* storage blocked or corrupted: fall back to defaults */ }
  return data;
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(saveData)); } catch (e) { /* ignore */ }
}
let saveData = loadSave();

/* ---------- Helpers ---------- */
const rand   = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const chance = p => Math.random() < p;
const pick   = arr => arr[Math.floor(Math.random() * arr.length)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
const inBounds = (x, y) => x >= 0 && y >= 0 && x < GRID && y < GRID;

/* ---------- Tiles ---------- */
const T = {
  FLOOR: 0, WALL: 1, DOOR: 2,          // DOOR = open wooden doorway (walkable)
  SANCT_DOOR: 3,                        // purple door: Sanctum -> Courtyard
  BOSS_DOOR: 4,                         // locked until the Key is found
  ALTAR: 5, VAULT: 6,                   // Sanctum stations
  ANVIL: 7, TREE: 8, RUIN: 9,           // room stations
  PORTAL: 10                            // appears after the boss falls
};
const SOLID_TILES = new Set([T.WALL, T.SANCT_DOOR, T.BOSS_DOOR, T.ALTAR, T.VAULT, T.ANVIL, T.TREE, T.RUIN]);

/* ---------- Game state ---------- */
let map = [];
let player = null;
let enemies = [];
let coins = [];        // {x, y, value}  - walk over them to collect
let items = [];        // {type:'key', x, y}
let area = 'sanctum';  // 'sanctum' | 'dungeon'
let currentDepth = 1;
let hasKey = false;
let treeUsed = false;  // Offering Tree: once per floor
let portalPos = null;  // set when the boss dies (Part 2)
let roomInfo = [];     // [{type, rect, door:{x,y}}] for the 3 random rooms

const COURT = { x: 5, y: 7, w: 10, h: 6 };   // Courtyard rectangle
const makeGrid = fill => Array.from({ length: GRID }, () => Array(GRID).fill(fill));

/* ---------- 4. Player initialization ---------- */
function initPlayer() {
  const maxHp = 10 + saveData.bonusMaxHp;
  player = { x: 0, y: 0, hp: maxHp, maxHp: maxHp, atk: 1 + saveData.bonusAtk, gold: 0 };
}

/* ---------- 6. Enemy scaling (by currentDepth) ---------- */
const ENEMY_BASE = {
  goblin: { hp: 6,  atk: 2, gold: [2, 4],   slow: false },
  tin:    { hp: 12, atk: 3, gold: [4, 7],   slow: true  },   // Tin Man acts every other turn
  boss:   { hp: 40, atk: 6, gold: [25, 40], slow: false }
};
function makeEnemy(type, x, y) {
  const b = ENEMY_BASE[type];
  const d = currentDepth - 1;
  const hp  = Math.round(b.hp * (1 + 0.25 * d));
  const atk = b.atk + Math.floor(d * (type === 'boss' ? 1 : 0.6));
  const gold = Math.round(rand(b.gold[0], b.gold[1]) * (1 + 0.1 * d));
  return { type: type, x: x, y: y, hp: hp, maxHp: hp, atk: atk, gold: gold, slow: b.slow, skip: false };
}
function dropCoin(x, y, value) { coins.push({ x: x, y: y, value: value }); }

/* ---------- 5. Map generation ---------- */
function isWall(x, y) { return !inBounds(x, y) || map[y][x] === T.WALL; }
function isSolid(x, y) { return !inBounds(x, y) || SOLID_TILES.has(map[y][x]); }
function enemyAt(x, y) { return enemies.find(e => e.x === x && e.y === y); }
function coinAt(x, y)  { return coins.find(c => c.x === x && c.y === y); }
function itemAt(x, y)  { return items.find(i => i.x === x && i.y === y); }
function occupied(x, y) {
  return (player && player.x === x && player.y === y) || enemyAt(x, y) || itemAt(x, y) || coinAt(x, y);
}
function carve(r) {
  for (let y = r.y; y < r.y + r.h; y++)
    for (let x = r.x; x < r.x + r.w; x++) map[y][x] = T.FLOOR;
}
function freeCells(r) {
  const out = [];
  for (let y = r.y; y < r.y + r.h; y++)
    for (let x = r.x; x < r.x + r.w; x++)
      if (map[y][x] === T.FLOOR && !occupied(x, y)) out.push({ x: x, y: y });
  return out;
}

function resetEntities() {
  enemies = []; coins = []; items = [];
  portalPos = null; hasKey = false; treeUsed = false; roomInfo = [];
}

/* Sanctum: safe zone with the Altar, the Vault and the purple door */
function generateSanctum() {
  area = 'sanctum';
  resetEntities();
  map = makeGrid(T.WALL);
  const w = rand(10, 12), h = rand(8, 10);
  const r = { x: Math.floor((GRID - w) / 2), y: rand(5, 6), w: w, h: h };
  carve(r);
  const doorX = r.x + Math.floor(w / 2);
  map[r.y - 1][doorX] = T.SANCT_DOOR;                     // purple door in the top wall
  const left = chance(0.5);                               // Altar/Vault swap sides at random
  map[r.y][r.x + 2]         = left ? T.ALTAR : T.VAULT;
  map[r.y][r.x + w - 3]     = left ? T.VAULT : T.ALTAR;
  player.x = doorX;
  player.y = r.y + h - 2;
}

/* Courtyard + 3 randomized rooms + Boss room */
function generateDungeon() {
  area = 'dungeon';
  resetEntities();
  map = makeGrid(T.WALL);
  carve(COURT);

  // Room slots around the courtyard, each with a door onto it
  const slots = [
    (() => { const h = rand(3, 5), y = rand(7, 13 - h);
             const rect = { x: 1, y: y, w: 3, h: h };
             return { rect: rect, door: { x: 4, y: rand(y, y + h - 1) } }; })(),
    (() => { const h = rand(3, 5), y = rand(7, 13 - h);
             const rect = { x: 16, y: y, w: 3, h: h };
             return { rect: rect, door: { x: 15, y: rand(y, y + h - 1) } }; })(),
    (() => { const w = rand(4, 6), h = rand(3, 5), x = rand(6, 8);
             const rect = { x: x, y: 14, w: w, h: h };
             return { rect: rect, door: { x: rand(x, x + w - 1), y: 13 } }; })()
  ];
  const types = shuffle(['blacksmith', 'tree', 'ruin']);
  const stationTile = { blacksmith: T.ANVIL, tree: T.TREE, ruin: T.RUIN };

  slots.forEach((s, i) => {
    carve(s.rect);
    map[s.door.y][s.door.x] = T.DOOR;
    const cx = s.rect.x + Math.floor(s.rect.w / 2);
    const cy = s.rect.y + Math.floor(s.rect.h / 2);
    map[cy][cx] = stationTile[types[i]];
    roomInfo.push({ type: types[i], rect: s.rect, door: s.door });
  });

  // Boss room (north) behind the locked Boss Door
  const bossRect = { x: 6, y: 1, w: 8, h: 5 };
  carve(bossRect);
  map[6][rand(8, 11)] = T.BOSS_DOOR;

  // The Key lies on the floor of one random room
  const keyRoom = pick(roomInfo);
  const keyCell = pick(freeCells(keyRoom.rect));
  items.push({ type: 'key', x: keyCell.x, y: keyCell.y });

  // Player enters at the south of the courtyard
  player.x = 9; player.y = 11;

  // Courtyard enemies (kept away from the spawn point)
  const nCourt = 3 + Math.min(3, Math.floor(currentDepth / 3));
  const courtCells = shuffle(freeCells(COURT).filter(c => Math.abs(c.x - player.x) + Math.abs(c.y - player.y) > 3));
  for (let i = 0; i < nCourt && courtCells.length; i++) {
    const c = courtCells.pop();
    enemies.push(makeEnemy(chance(0.3 + currentDepth * 0.05) ? 'tin' : 'goblin', c.x, c.y));
  }
  // Room enemies: the Ruin is guarded, the Blacksmith is safe
  roomInfo.forEach(room => {
    const n = room.type === 'ruin' ? 2 : room.type === 'tree' ? 1 : 0;
    const cells = shuffle(freeCells(room.rect));
    for (let i = 0; i < n && cells.length; i++) {
      const c = cells.pop();
      enemies.push(makeEnemy(chance(0.25) ? 'tin' : 'goblin', c.x, c.y));
    }
  });
  // The Boss
  enemies.push(makeEnemy('boss', 10, 3));
}

function enterSanctum(healFully) {
  if (!player) initPlayer();
  if (healFully) player.hp = player.maxHp;
  generateSanctum();
  updateHUD();
}
function enterDungeon() { currentDepth = 1; generateDungeon(); updateHUD(); }
function descend()      { currentDepth++;    generateDungeon(); updateHUD(); }   // Boss portal

/* ---------- 7. Drawing: sprites (8x8 art drawn at 2x) ---------- */
function drawSprite(rows, pal, px, py) {
  for (let cy = 0; cy < 8; cy++) {
    for (let cx = 0; cx < 8; cx++) {
      const ch = rows[cy][cx];
      if (ch === '.') continue;
      ctx.fillStyle = pal[ch];
      ctx.fillRect(px + cx * 2, py + cy * 2, 2, 2);
    }
  }
}
const SPRITES = {
  player: {
    pal: { H: '#9aa7b8', S: '#f0c090', e: '#201020', B: '#3b82c4', b: '#e0b040', L: '#5a4030' },
    rows: ['..HHHH..', '.HHHHHH.', '.SeSSeS.', '.SSSSSS.', '..BBBB..', '.BBbbBB.', '..L..L..', '.LL..LL.']
  },
  goblin: {
    pal: { G: '#5fa03a', y: '#ffe14a', m: '#802020', L: '#3a2a1a' },
    rows: ['GG....GG', '.GGGGGG.', '.GyGGyG.', '.GGGGGG.', '..GmmG..', '.GGGGGG.', '.G.GG.G.', '..LL.LL.']
  },
  tin: {
    pal: { S: '#b8c4cc', s: '#e8f0f4', K: '#1a2430', r: '#e04040' },
    rows: ['..SSSS..', '.SssssS.', '.SKrrKS.', '.SSSSSS.', 'SSSSSSSS', 'S.SSSS.S', '..SSSS..', '..SS.SS.']
  },
  boss: {
    pal: { R: '#a02030', y: '#ffd040', w: '#f4f4e8' },
    rows: ['R......R', 'RR.RR.RR', '.RRRRRR.', '.RyRRyR.', '.RRRRRR.', 'RRwRRwRR', 'RRRRRRRR', '.RR..RR.']
  },
  coin: {
    pal: { o: '#a87810', Y: '#f5d142', y: '#fff0a0' },
    rows: ['........', '..oooo..', '.oYYYYo.', '.oYyyYo.', '.oYyyYo.', '.oYYYYo.', '..oooo..', '........']
  },
  key: {
    pal: { Y: '#f5d142', o: '#a87810' },
    rows: ['..YYY...', '.Y...Y..', '.Y...Y..', '..YYY...', '...Y....', '...YY...', '...Y....', '...YY...']
  }
};

/* ---------- 7. Drawing: tiles ---------- */
const hash = (x, y) => ((x * 73856093) ^ (y * 19349663)) >>> 0;
const R = (px, py, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(px + x, py + y, w, h); };

function drawFloor(x, y, px, py) {
  const sanct = area === 'sanctum';
  R(px, py, 0, 0, TILE, TILE, ((x + y) & 1) ? (sanct ? '#3f3f5e' : '#3a3248') : (sanct ? '#44446a' : '#352d43'));
  const h = hash(x, y);
  if (h % 5 === 0) R(px, py, (h >> 3) % 12 + 2, (h >> 7) % 12 + 2, 2, 1, sanct ? '#55557e' : '#2a2338');
}
function drawWall(x, y, px, py) {
  R(px, py, 0, 0, TILE, TILE, '#1f1a2c');
  R(px, py, 0, 7, TILE, 1, '#2b2440');
  R(px, py, 0, 15, TILE, 1, '#2b2440');
  const off = (y & 1) ? 4 : 10;
  R(px, py, off, 0, 1, 7, '#2b2440');
  R(px, py, (off + 8) % 16, 8, 1, 7, '#2b2440');
}
function drawDoor(px, py) {            // open wooden doorway
  R(px, py, 0, 0, TILE, TILE, '#2a2016');
  R(px, py, 2, 1, 12, 15, '#6b4a2a');
  R(px, py, 4, 3, 8, 13, '#1a1008');
  R(px, py, 3, 1, 10, 1, '#8a6238');
}
function drawSanctDoor(px, py) {       // purple door
  R(px, py, 0, 0, TILE, TILE, '#1f1a2c');
  R(px, py, 1, 1, 14, 15, '#4a2a7a');
  R(px, py, 3, 3, 10, 13, '#8a4be0');
  R(px, py, 7, 3, 2, 13, '#6a30b8');
  R(px, py, 11, 9, 2, 2, '#f5d142');
}
function drawBossDoor(px, py) {        // iron door with lock (green once Key is held)
  R(px, py, 0, 0, TILE, TILE, '#1f1a2c');
  R(px, py, 1, 1, 14, 15, '#4a1218');
  R(px, py, 3, 3, 10, 13, '#7a1e28');
  R(px, py, 3, 7, 10, 1, '#2a0a0e');
  R(px, py, 3, 12, 10, 1, '#2a0a0e');
  R(px, py, 6, 8, 4, 4, hasKey ? '#5fd05f' : '#f5d142');
  R(px, py, 7, 9, 2, 2, '#1a1008');
}
function drawAltar(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 2, 10, 12, 5, '#6a6a84');
  R(px, py, 4, 6, 8, 5, '#8a8aa8');
  R(px, py, 6, 2, 4, 4, '#5fd0ff');
  R(px, py, 7, 1, 2, 2, '#d8f6ff');
}
function drawVault(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 1, 6, 14, 9, '#7a4e22');
  R(px, py, 1, 6, 14, 3, '#9a6a30');
  R(px, py, 1, 9, 14, 1, '#3a2410');
  R(px, py, 7, 8, 2, 4, '#f5d142');
}
function drawAnvil(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 3, 11, 10, 4, '#4a4a58');
  R(px, py, 5, 8, 6, 4, '#6a6a7a');
  R(px, py, 1, 5, 14, 4, '#8a8a9c');
  R(px, py, 1, 5, 14, 1, '#b8b8c8');
  R(px, py, 12, 2, 2, 3, '#f09030');    // glowing hot iron
}
function drawTree(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 7, 8, 3, 8, '#5a3a1e');
  R(px, py, 2, 2, 12, 7, treeUsed ? '#6a7a4a' : '#3a9a4a');
  R(px, py, 4, 1, 8, 2, treeUsed ? '#6a7a4a' : '#3a9a4a');
  if (!treeUsed) { R(px, py, 4, 4, 2, 2, '#f5d142'); R(px, py, 10, 5, 2, 2, '#f5d142'); }
}
function drawRuin(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 2, 8, 5, 7, '#6a6258');
  R(px, py, 3, 6, 3, 3, '#8a8274');
  R(px, py, 9, 11, 5, 4, '#5a5248');
  R(px, py, 10, 9, 3, 3, '#7a7264');
  R(px, py, 7, 13, 2, 2, '#3a342c');
}
function drawPortal(px, py) {
  drawFloor(0, 0, px, py);
  R(px, py, 2, 2, 12, 12, '#1a4a7a');
  R(px, py, 4, 4, 8, 8, '#3a9ae0');
  R(px, py, 6, 6, 4, 4, '#b8f0ff');
}

function drawTile(t, x, y) {
  const px = x * TILE, py = y * TILE;
  switch (t) {
    case T.WALL:       drawWall(x, y, px, py); break;
    case T.DOOR:       drawDoor(px, py); break;
    case T.SANCT_DOOR: drawSanctDoor(px, py); break;
    case T.BOSS_DOOR:  drawBossDoor(px, py); break;
    case T.ALTAR:      drawAltar(px, py); break;
    case T.VAULT:      drawVault(px, py); break;
    case T.ANVIL:      drawAnvil(px, py); break;
    case T.TREE:       drawTree(px, py); break;
    case T.RUIN:       drawRuin(px, py); break;
    case T.PORTAL:     drawPortal(px, py); break;
    default:           drawFloor(x, y, px, py);
  }
}

/* ---------- 7. Drawing: entities and full frame ---------- */
function drawEntity(kind, x, y) {
  const s = SPRITES[kind];
  drawSprite(s.rows, s.pal, x * TILE, y * TILE);
}
function drawHpBar(e) {
  if (e.hp >= e.maxHp) return;
  const px = e.x * TILE, py = e.y * TILE;
  R(px, py, 1, 0, 14, 2, '#2a0a10');
  R(px, py, 1, 0, Math.max(1, Math.round(14 * e.hp / e.maxHp)), 2, '#e0475b');
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < GRID; y++)
    for (let x = 0; x < GRID; x++) drawTile(map[y][x], x, y);
  items.forEach(i => drawEntity(i.type, i.x, i.y));
  coins.forEach(c => drawEntity('coin', c.x, c.y));
  enemies.forEach(e => { drawEntity(e.type, e.x, e.y); drawHpBar(e); });
  drawEntity('player', player.x, player.y);
}

/* =====================================================================
   PART 2: overlays, turn logic, enemy AI, input, boot
   ===================================================================== */

/* ---------- Overlay UI: showMessage / showShop / showAltar ---------- */
const overlayEl = document.getElementById('overlay');
const panelEl = document.getElementById('panel');
let gameOver = false;

function overlayOpen() { return overlayEl.classList.contains('open'); }
function closeOverlay() { overlayEl.classList.remove('open'); updateHUD(); draw(); }

function showPanel(title, text, buttons) {
  panelEl.innerHTML = '';
  const h = document.createElement('h2'); h.textContent = title; panelEl.appendChild(h);
  const p = document.createElement('p'); p.textContent = text; panelEl.appendChild(p);
  buttons.forEach(b => {
    const btn = document.createElement('button');
    btn.textContent = b.label;
    btn.disabled = !!b.disabled;
    btn.addEventListener('click', b.fn);
    panelEl.appendChild(btn);
  });
  overlayEl.classList.add('open');
  const first = panelEl.querySelector('button:not(:disabled)');
  if (first) first.focus();
}
function showMessage(title, text, onClose) {
  showPanel(title, text, [{ label: 'OK', fn: () => { closeOverlay(); if (onClose) onClose(); } }]);
}

/* Altar: spend banked gold on permanent upgrades */
function showAltar() {
  const hpCost = 20 + 5 * saveData.bonusMaxHp;
  const atkCost = 30 + 20 * saveData.bonusAtk;
  showPanel('Altar', 'Banked gold: ' + saveData.permanentGold + '. Offerings last across every run.', [
    { label: '+2 Max HP (' + hpCost + 'g)', disabled: saveData.permanentGold < hpCost, fn: () => {
        saveData.permanentGold -= hpCost; saveData.bonusMaxHp += 2;
        player.maxHp += 2; player.hp += 2; writeSave(); updateHUD(); showAltar(); } },
    { label: '+1 ATK (' + atkCost + 'g)', disabled: saveData.permanentGold < atkCost, fn: () => {
        saveData.permanentGold -= atkCost; saveData.bonusAtk += 1;
        player.atk += 1; writeSave(); updateHUD(); showAltar(); } },
    { label: 'Leave', fn: closeOverlay }
  ]);
}
function showVault() {
  showMessage('Vault', 'Banked gold: ' + saveData.permanentGold + '. Gold you carry is banked when you fall or take a portal.');
}

/* Blacksmith: spend gold carried this run */
function showShop() {
  const atkCost = 12 + 8 * (player.atk - 1 - saveData.bonusAtk);
  const healCost = 8;
  showPanel('Blacksmith', 'You carry ' + player.gold + ' gold. Upgrades last until this run ends.', [
    { label: 'Sharpen blade +1 ATK (' + atkCost + 'g)', disabled: player.gold < atkCost, fn: () => {
        player.gold -= atkCost; player.atk += 1; updateHUD(); showShop(); } },
    { label: 'Patch armor, full heal (' + healCost + 'g)', disabled: player.gold < healCost || player.hp >= player.maxHp, fn: () => {
        player.gold -= healCost; player.hp = player.maxHp; updateHUD(); showShop(); } },
    { label: 'Leave', fn: closeOverlay }
  ]);
}

/* Offering Tree: trade 1 ATK for random gold, once per floor */
function showTree() {
  if (treeUsed) return showMessage('Offering Tree', 'The tree has taken its offering. It is quiet now.');
  if (player.atk <= 1) return showMessage('Offering Tree', 'You have no strength to spare. (Needs at least 2 ATK)');
  showPanel('Offering Tree', 'Give up 1 ATK for a shower of gold. The tree accepts one offering per floor.', [
    { label: 'Offer 1 ATK', fn: () => {
        const g = rand(15, 30) + 5 * currentDepth;
        player.atk -= 1; player.gold += g; treeUsed = true;
        closeOverlay(); setLog('The tree gives you ' + g + ' gold.'); } },
    { label: 'Walk away', fn: closeOverlay }
  ]);
}

/* ---------- Death and floor transitions ---------- */
function bankGold() {
  saveData.permanentGold += player.gold; player.gold = 0; writeSave();
}
function die() {
  gameOver = true;
  const banked = player.gold;
  bankGold();
  draw(); updateHUD();
  showMessage('You fell', 'Reached depth ' + currentDepth + '. ' + banked + ' gold was banked in your Vault.', () => {
    gameOver = false; currentDepth = 1; initPlayer(); enterSanctum(true); draw(); setLog('You wake in the Sanctum.');
  });
}
function takePortal() {
  const banked = player.gold;
  bankGold();
  descend();
  player.hp = Math.min(player.maxHp, player.hp + Math.ceil(player.maxHp * 0.2));
  updateHUD(); draw();
  setLog('Depth ' + currentDepth + '. ' + banked + ' gold banked.');
}

/* ---------- doTurn: player action ---------- */
function doTurn(dx, dy) {
  if (gameOver || overlayOpen()) return;
  const tx = player.x + dx, ty = player.y + dy;
  const wait = dx === 0 && dy === 0;

  if (!wait) {
    // Attack
    const foe = enemyAt(tx, ty);
    if (foe) {
      foe.hp -= player.atk;
      if (foe.hp <= 0) {
        enemies.splice(enemies.indexOf(foe), 1);
        dropCoin(foe.x, foe.y, foe.gold);                  // must be walked over to collect
        setLog('You defeated the ' + (foe.type === 'tin' ? 'Tin Man' : foe.type) + '.');
        if (foe.type === 'boss') {
          portalPos = { x: foe.x, y: foe.y };
          map[foe.y][foe.x] = T.PORTAL;
          setLog('The Boss falls. A portal opens.');
        }
      } else {
        setLog('You hit for ' + player.atk + '.');
      }
    } else if (isSolid(tx, ty)) {
      // Bump interactions (free actions, no turn spent)
      const t = inBounds(tx, ty) ? map[ty][tx] : T.WALL;
      if (t === T.SANCT_DOOR) { enterDungeon(); draw(); setLog('The Courtyard. Find the Key.'); }
      else if (t === T.ALTAR) showAltar();
      else if (t === T.VAULT) showVault();
      else if (t === T.ANVIL) showShop();
      else if (t === T.TREE) showTree();
      else if (t === T.RUIN) showMessage('Abandoned Ruin', 'Crumbled stone and old bones. Whatever was here is gone.');
      else if (t === T.BOSS_DOOR) {
        if (hasKey) { map[ty][tx] = T.DOOR; setLog('The Key turns. The Boss Door opens.'); draw(); }
        else showMessage('Boss Door', 'Locked. A Key lies in one of the rooms.');
      }
      return;
    } else {
      // Move
      player.x = tx; player.y = ty;
      const coin = coinAt(tx, ty);
      if (coin) { player.gold += coin.value; coins.splice(coins.indexOf(coin), 1); setLog('+' + coin.value + ' gold.'); }
      const item = itemAt(tx, ty);
      if (item && item.type === 'key') { hasKey = true; items.splice(items.indexOf(item), 1); setLog('You found the Key.'); }
      if (map[ty][tx] === T.PORTAL) { takePortal(); return; }
    }
  }
  endTurn();
  updateHUD(); draw();
}

/* ---------- endTurn: enemy AI ---------- */
function canEnter(x, y) {
  return !isSolid(x, y) && !enemyAt(x, y) && !(player.x === x && player.y === y);
}
function endTurn() {
  let dmg = 0;
  for (const e of enemies) {
    if (e.slow) { e.skip = !e.skip; if (e.skip) continue; }
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.abs(dx) + Math.abs(dy);
    if (dist === 1) { dmg += e.atk; continue; }                 // attack
    if (dist > 8) continue;                                      // too far to notice you
    const sx = Math.sign(dx), sy = Math.sign(dy);
    const steps = Math.abs(dx) >= Math.abs(dy) ? [[sx, 0], [0, sy]] : [[0, sy], [sx, 0]];
    for (const [mx, my] of steps) {
      if ((mx || my) && canEnter(e.x + mx, e.y + my)) { e.x += mx; e.y += my; break; }
    }
  }
  if (dmg > 0) {
    player.hp = Math.max(0, player.hp - dmg);
    setLog('You take ' + dmg + ' damage.');
    if (player.hp <= 0) die();
  }
}

/* ---------- Input ---------- */
const KEYS = {
  ArrowUp: [0, -1], w: [0, -1], W: [0, -1], ArrowDown: [0, 1], s: [0, 1], S: [0, 1],
  ArrowLeft: [-1, 0], a: [-1, 0], A: [-1, 0], ArrowRight: [1, 0], d: [1, 0], D: [1, 0],
  ' ': [0, 0], '.': [0, 0]
};
window.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && overlayOpen() && !gameOver) { closeOverlay(); return; }
  const m = KEYS[ev.key];
  if (!m || overlayOpen()) return;
  ev.preventDefault();
  doTurn(m[0], m[1]);
});
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0], wait: [0, 0] };
document.getElementById('dpad').addEventListener('click', ev => {
  const b = ev.target.closest('button');
  if (b) doTurn(...DIRS[b.dataset.dir]);
});

/* ---------- Boot ---------- */
function boot() {
  initPlayer();
  enterSanctum(true);
  draw();
  setLog('Bump the Altar to upgrade. Take the purple door to enter the Courtyard.');
}
boot();
</script>
