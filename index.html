<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project 2 - Stage 3</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      background: #111;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1/1;
      background: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #222;
    }
    #location { color: #ffcc00; }
    #controls {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      padding: 10px;
      background: #1a1a1a;
    }
    button {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { background: #555; }
    .empty { visibility: hidden; }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 20px;
      border: 2px solid #fff;
      text-align: center;
      display: none;
      z-index: 10;
      width: 80%;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>HP: <span id="hp">10</span></div>
    <div>ATK: <span id="atk">1</span></div>
    <div>KEY: <span id="hasKey" style="color:#ff3333">No</span></div>
    <div>LOC: <span id="location">Courtyard</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div id="message">
      <h2 id="msg-title" style="margin:0 0 10px 0;">You Died</h2>
      <button onclick="restartGame()" style="padding: 10px 20px; margin-top: 10px;">Restart</button>
    </div>
  </div>

  <div id="controls">
    <button class="empty"></button>
    <button onclick="doTurn(0, -1)">▲</button>
    <button class="empty"></button>
    <button onclick="doTurn(-1, 0)">◀</button>
    <button onclick="doTurn(0, 1)">▼</button>
    <button onclick="doTurn(1, 0)">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const TILE_SIZE = 16;
    const MAP_SIZE = 20;

    let player = { x: 10, y: 16, hp: 10, maxHp: 10, atk: 1, hasKey: false };
    let gameState = 'PLAYING'; 
    let currentMap = 'HUB';

    // Helper function to draw a box room (walls)
    function addWalls(map, x1, y1, x2, y2) {
      for (let y = y1; y <= y2; y++) {
        for (let x = x1; x <= x2; x++) {
          if (x === x1 || y === y1 || x === x2 || y === y2) {
            map.walls.push({x, y});
          }
        }
      }
    }

    let maps = {
      HUB: { name: "Courtyard", walls: [], doors: [], enemy: null, loot: null, exit: null, bossDoor: null },
      BLACKSMITH: { name: "Blacksmith", walls: [], doors: [], enemy: null, loot: null },
      HOUSE: { name: "Abandoned House", walls: [], doors: [], enemy: null, loot: null },
      BOSS_ROOM: { name: "Boss Lair", walls: [], doors: [], enemy: null, loot: null }
    };

    function buildMaps() {
      // --- HUB ---
      let hub = maps.HUB;
      hub.walls = [];
      addWalls(hub, 0, 0, 19, 19); // Outer border
      // Internal obstacles
      addWalls(hub, 5, 10, 14, 10); // A long wall in the middle
      
      hub.doors = [
        { x: 4, y: 1, target: 'BLACKSMITH', spawnX: 10, spawnY: 18, color: '#ffaa00' },
        { x: 10, y: 1, target: 'HOUSE', spawnX: 10, spawnY: 18, color: '#ff00ff' }
      ];
      
      // The Boss Door and the Exit inside it
      hub.bossDoor = { x: 16, y: 1, target: 'BOSS_ROOM', spawnX: 10, spawnY: 18, color: '#00aaff' };
      
      hub.enemy = { x: 10, y: 6, hp: 6, atk: 2, alive: true };
      hub.loot = { x: 17, y: 17, active: true, type: 'atk' }; // ATK buff in the courtyard

      // --- BLACKSMITH (Has the Key) ---
      let smith = maps.BLACKSMITH;
      smith.walls = [];
      addWalls(smith, 0, 0, 19, 19);
      addWalls(smith, 4, 4, 15, 4); // Counter
      addWalls(smith, 4, 4, 4, 12); // Side wall
      
      smith.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 4, spawnY: 2, color: '#ffffff' }];
      smith.enemy = { x: 10, y: 8, hp: 8, atk: 3, alive: true }; // Tin Man guard
      smith.loot = { x: 10, y: 5, active: true, type: 'key' }; // The Boss Key

      // --- HOUSE (Has a Trap/Enemy) ---
      let house = maps.HOUSE;
      house.walls = [];
      addWalls(house, 0, 0, 19, 19);
      addWalls(house, 5, 5, 14, 14); // Inner room
      house.walls = house.walls.filter(w => !(w.x === 10 && w.y === 14)); // Doorway into inner room
      
      house.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 10, spawnY: 2, color: '#ffffff' }];
      house.enemy = { x: 10, y: 10, hp: 4, atk: 1, alive: true }; // Goblin inside
      house.loot = { x: 10, y: 16, active: true, type: 'atk' };

      // --- BOSS ROOM ---
      let boss = maps.BOSS_ROOM;
      boss.walls = [];
      addWalls(boss, 0, 0, 19, 19);
      boss.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 16, spawnY: 2, color: '#ffffff' }];
      boss.exit = { x: 10, y: 2 }; // The blue portal to finish the run
      boss.enemy = { x: 10, y: 6, hp: 15, atk: 4, alive: true }; // Boss
    }

    function isWall(x, y) {
      return maps[currentMap].walls.some(w => w.x === x && w.y === y);
    }

    function draw() {
      let map = maps[currentMap];
      
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Walls
      ctx.fillStyle = '#444';
      map.walls.forEach(w => ctx.fillRect(w.x * TILE_SIZE, w.y * TILE_SIZE, TILE_SIZE, TILE_SIZE));

      // Draw Normal Doors
      if (map.doors) {
        map.doors.forEach(d => {
          ctx.fillStyle = d.color;
          ctx.fillRect(d.x * TILE_SIZE, d.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        });
      }

      // Draw Boss Door
      if (map.bossDoor) {
        ctx.fillStyle = map.bossDoor.color;
        ctx.fillRect(map.bossDoor.x * TILE_SIZE, map.bossDoor.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        // Draw a lock on it
        if (!player.hasKey) {
          ctx.fillStyle = '#000';
          ctx.fillRect(map.bossDoor.x * TILE_SIZE + 6, map.bossDoor.y * TILE_SIZE + 6, 4, 4);
        }
      }

      // Draw Exit
      if (map.exit) {
        ctx.fillStyle = '#00aaff';
        ctx.fillRect(map.exit.x * TILE_SIZE, map.exit.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }

      // Draw Loot
      if (map.loot && map.loot.active) {
        ctx.fillStyle = map.loot.type === 'key' ? '#ff0000' : '#ffcc00'; // Key is red, ATK is gold
        ctx.fillRect(map.loot.x * TILE_SIZE + 4, map.loot.y * TILE_SIZE + 4, 8, 8);
      }

      // Draw Enemy
      if (map.enemy && map.enemy.alive) {
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        // HP bar
        ctx.fillStyle = '#000';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 4, TILE_SIZE, 3);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 4, (map.enemy.hp / 15) * TILE_SIZE, 3); // 15 max HP
      }

      // Draw Player
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x * TILE_SIZE, player.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

      updateUI();
    }

    function updateUI() {
      document.getElementById('hp').innerText = player.hp;
      document.getElementById('atk').innerText = player.atk;
      document.getElementById('location').innerText = maps[currentMap].name;
      document.getElementById('hasKey').innerText = player.hasKey ? "Yes" : "No";
      document.getElementById('hasKey').style.color = player.hasKey ? "#00ff00" : "#ff3333";
    }

    function doTurn(dx, dy) {
      if (gameState !== 'PLAYING') return;
      let targetX = player.x + dx;
      let targetY = player.y + dy;
      let map = maps[currentMap];

      if (isWall(targetX, targetY)) return;

      // Handle Boss Door Logic
      if (map.bossDoor && targetX === map.bossDoor.x && targetY === map.bossDoor.y) {
        if (player.hasKey) {
          currentMap = map.bossDoor.target;
          player.x = map.bossDoor.spawnX;
          player.y = map.bossDoor.spawnY;
          draw();
        } else {
          showMessage("The door is locked. You need a red key.", true);
        }
        return;
      }

      // Handle Normal Doors
      let door = map.doors.find(d => d.x === targetX && d.y === targetY);
      if (door) {
        currentMap = door.target;
        player.x = door.spawnX;
        player.y = door.spawnY;
        draw();
        return;
      }

      if (map.exit && targetX === map.exit.x && targetY === map.exit.y) {
        gameState = 'WIN';
        showMessage("You cleared the dungeon!");
        return;
      }

      if (map.enemy && map.enemy.alive && targetX === map.enemy.x && targetY === map.enemy.y) {
        map.enemy.hp -= player.atk;
        if (map.enemy.hp <= 0) map.enemy.alive = false;
        endTurn(); 
        return;
      }

      player.x = targetX;
      player.y = targetY;

      if (map.loot && map.loot.active && player.x === map.loot.x && player.y === map.loot.y) {
        map.loot.active = false;
        if (map.loot.type === 'key') {
          player.hasKey = true;
          showMessage("You found the Boss Key!", true);
        } else {
          player.atk += 1;
          showMessage("Found a weapon! ATK +1", true);
        }
      }

      endTurn();
    }

    function endTurn() {
      let map = maps[currentMap];
      if (map.enemy && map.enemy.alive) {
        moveEnemy(map.enemy);
        if (map.enemy.x === player.x && map.enemy.y === player.y) {
          player.hp -= map.enemy.atk;
          if (player.hp <= 0) {
            player.hp = 0;
            gameState = 'DEAD';
            showMessage("You Died");
          }
        }
      }
      draw();
    }

    function moveEnemy(enemy) {
      let dx = player.x - enemy.x;
      let dy = player.y - enemy.y;
      let dist = Math.abs(dx) + Math.abs(dy);

      if (dist <= 6) {
        let moveX = 0, moveY = 0;
        if (Math.abs(dx) > Math.abs(dy)) moveX = Math.sign(dx);
        else moveY = Math.sign(dy);

        let nextX = enemy.x + moveX, nextY = enemy.y + moveY;

        if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
          enemy.x = nextX; enemy.y = nextY;
        } else {
          moveX = 0; moveY = 0;
          if (Math.abs(dy) > 0) moveY = Math.sign(dy);
          nextX = enemy.x + moveX; nextY = enemy.y + moveY;
          if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
            enemy.x = nextX; enemy.y = nextY;
          }
        }
      }
    }

    function showMessage(text, isDialog = false) {
      document.getElementById('msg-title').innerText = text;
      let btn = document.querySelector('#message button');
      if (isDialog) {
        btn.innerText = "Continue";
        btn.onclick = () => { document.getElementById('message').style.display = 'none'; };
      } else {
        btn.innerText = "Restart";
        btn.onclick = restartGame;
      }
      document.getElementById('message').style.display = 'block';
    }

    function restartGame() {
      player = { x: 10, y: 16, hp: 10, maxHp: 10, atk: 1, hasKey: false };
      gameState = 'PLAYING';
      currentMap = 'HUB';
      buildMaps();
      document.getElementById('message').style.display = 'none';
      draw();
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') doTurn(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') doTurn(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') doTurn(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') doTurn(1, 0);
      if (e.key === ' ' && gameState !== 'PLAYING') {
         if (document.getElementById('message').style.display === 'block') document.querySelector('#message button').click();
         else restartGame();
      }
    });

    buildMaps();
    restartGame();
  </script>
</body>
</html>
