<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Project 2 - Stage 2</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    body {
      margin: 0;
      background: #111;
      color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: monospace;
      touch-action: none;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1/1;
      background: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
    }
    #ui {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #fff;
      background: #222;
    }
    #location { color: #ffcc00; } /* Highlight the location name */
    #controls {
      width: 100%;
      max-width: 500px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 5px;
      padding: 10px;
      background: #1a1a1a;
    }
    button {
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      background: #333;
      color: #fff;
      border: 1px solid #555;
      border-radius: 5px;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { background: #555; }
    .empty { visibility: hidden; }
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.9);
      padding: 20px;
      border: 2px solid #fff;
      text-align: center;
      display: none;
      z-index: 10;
      width: 80%;
    }
  </style>
</head>
<body>

  <div id="ui">
    <div>HP: <span id="hp">10</span></div>
    <div>ATK: <span id="atk">1</span></div>
    <div>LOC: <span id="location">Courtyard</span></div>
  </div>

  <div id="game-container">
    <canvas id="gameCanvas" width="320" height="320"></canvas>
    <div id="message">
      <h2 id="msg-title" style="margin:0 0 10px 0;">You Died</h2>
      <button onclick="restartGame()" style="padding: 10px 20px; margin-top: 10px;">Restart</button>
    </div>
  </div>

  <div id="controls">
    <button class="empty"></button>
    <button onclick="doTurn(0, -1)">▲</button>
    <button class="empty"></button>
    <button onclick="doTurn(-1, 0)">◀</button>
    <button onclick="doTurn(0, 1)">▼</button>
    <button onclick="doTurn(1, 0)">▶</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const TILE_SIZE = 16;
    const MAP_SIZE = 20;

    // Player Stats (Persists across maps)
    let player = { x: 0, y: 0, hp: 10, maxHp: 10, atk: 1 };
    
    let gameState = 'PLAYING'; 
    let currentMap = 'HUB'; // 'HUB' or 'INTERIOR_1', 'INTERIOR_2', 'INTERIOR_3'

    // Map Data Objects
    let maps = {
      HUB: {
        name: "Courtyard",
        walls: [],
        doors: [],
        enemy: null,
        loot: null,
        exit: null
      },
      INTERIOR_1: {
        name: "Blacksmith",
        walls: [],
        doors: [],
        npc: null,
        loot: null
      },
      INTERIOR_2: {
        name: "Abandoned House",
        walls: [],
        doors: [],
        enemy: null,
        loot: null
      },
      INTERIOR_3: {
        name: "Empty Shed",
        walls: [],
        doors: []
      }
    };

    // --- MAP GENERATION ---
    function buildMaps() {
      // 1. Build HUB (Courtyard)
      let hub = maps.HUB;
      hub.walls = [];
      // Outer walls
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) {
            hub.walls.push({x, y});
          }
        }
      }
      // Internal pillar
      for (let y = 6; y < 14; y++) { hub.walls.push({x: 8, y}); }
      
      // Hub Entities
      hub.doors = [
        { x: 4, y: 1, target: 'INTERIOR_1', spawnX: 10, spawnY: 18, color: '#ffaa00' }, // Orange door
        { x: 10, y: 1, target: 'INTERIOR_2', spawnX: 10, spawnY: 18, color: '#ff00ff' }, // Magenta door
        { x: 16, y: 1, target: 'INTERIOR_3', spawnX: 10, spawnY: 18, color: '#00ffff' }  // Cyan door
      ];
      hub.enemy = { x: 12, y: 12, hp: 5, atk: 2, alive: true };
      hub.loot = { x: 16, y: 16, active: true };
      hub.exit = { x: 18, y: 1 };

      // 2. Build INTERIOR_1 (Blacksmith)
      let int1 = maps.INTERIOR_1;
      int1.walls = [];
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) {
            int1.walls.push({x, y});
          }
        }
      }
      int1.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 10, spawnY: 2, color: '#ffffff' }]; // White exit door
      int1.npc = { x: 10, y: 5, color: '#aaaaaa' }; // Static NPC
      int1.loot = { x: 5, y: 5, active: true, type: 'atk' }; 

      // 3. Build INTERIOR_2 (Abandoned House)
      let int2 = maps.INTERIOR_2;
      int2.walls = [];
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) {
            int2.walls.push({x, y});
          }
        }
      }
      int2.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 10, spawnY: 2, color: '#ffffff' }];
      int2.enemy = { x: 10, y: 8, hp: 8, atk: 3, alive: true }; // Stronger enemy inside
      
      // 4. Build INTERIOR_3 (Empty Shed)
      let int3 = maps.INTERIOR_3;
      int3.walls = [];
      for (let y = 0; y < MAP_SIZE; y++) {
        for (let x = 0; x < MAP_SIZE; x++) {
          if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) {
            int3.walls.push({x, y});
          }
        }
      }
      int3.doors = [{ x: 10, y: 18, target: 'HUB', spawnX: 10, spawnY: 2, color: '#ffffff' }];
    }

    function isWall(x, y) {
      let map = maps[currentMap];
      return map.walls.some(w => w.x === x && w.y === y);
    }

    // DRAWING
    function draw() {
      let map = maps[currentMap];
      
      // Clear background
      ctx.fillStyle = '#111';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Walls
      ctx.fillStyle = '#444';
      map.walls.forEach(w => ctx.fillRect(w.x * TILE_SIZE, w.y * TILE_SIZE, TILE_SIZE, TILE_SIZE));

      // Draw Doors
      if (map.doors) {
        map.doors.forEach(d => {
          ctx.fillStyle = d.color;
          ctx.fillRect(d.x * TILE_SIZE, d.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
          // Draw door frame
          ctx.strokeStyle = '#000';
          ctx.lineWidth = 2;
          ctx.strokeRect(d.x * TILE_SIZE + 1, d.y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2);
        });
      }

      // Draw Exit (Only in Hub)
      if (map.exit) {
        ctx.fillStyle = '#00aaff';
        ctx.fillRect(map.exit.x * TILE_SIZE, map.exit.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }

      // Draw NPC
      if (map.npc) {
        ctx.fillStyle = map.npc.color;
        ctx.fillRect(map.npc.x * TILE_SIZE, map.npc.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
      }

      // Draw Loot
      if (map.loot && map.loot.active) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(map.loot.x * TILE_SIZE + 4, map.loot.y * TILE_SIZE + 4, 8, 8);
      }

      // Draw Enemy
      if (map.enemy && map.enemy.alive) {
        ctx.fillStyle = '#ff3333';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        // Enemy HP bar
        ctx.fillStyle = '#000';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 4, TILE_SIZE, 3);
        ctx.fillStyle = '#0f0';
        ctx.fillRect(map.enemy.x * TILE_SIZE, map.enemy.y * TILE_SIZE - 4, (map.enemy.hp / 8) * TILE_SIZE, 3);
      }

      // Draw Player
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(player.x * TILE_SIZE, player.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);

      updateUI();
    }

    function updateUI() {
      document.getElementById('hp').innerText = player.hp;
      document.getElementById('atk').innerText = player.atk;
      document.getElementById('location').innerText = maps[currentMap].name;
    }

    // LOGIC
    function doTurn(dx, dy) {
      if (gameState !== 'PLAYING') return;

      let targetX = player.x + dx;
      let targetY = player.y + dy;
      let map = maps[currentMap];

      // 1. Check Walls
      if (isWall(targetX, targetY)) return;

      // 2. Check Doors (Transition)
      let door = map.doors.find(d => d.x === targetX && d.y === targetY);
      if (door) {
        currentMap = door.target;
        player.x = door.spawnX;
        player.y = door.spawnY;
        draw();
        return; // Transitioning maps doesn't trigger enemy turn
      }

      // 3. Check Exit (Win)
      if (map.exit && targetX === map.exit.x && targetY === map.exit.y) {
        gameState = 'WIN';
        showMessage("You Escaped!");
        return;
      }

      // 4. Check NPC (Talk/Interact)
      if (map.npc && targetX === map.npc.x && targetY === map.npc.y) {
        showMessage("NPC: 'Welcome, traveller.'", true); // true means just a dialog, no restart button
        return; // Don't move into NPC
      }

      // 5. Check Enemy (Attack)
      if (map.enemy && map.enemy.alive && targetX === map.enemy.x && targetY === map.enemy.y) {
        map.enemy.hp -= player.atk;
        if (map.enemy.hp <= 0) map.enemy.alive = false;
        endTurn(); 
        return;
      }

      // 6. Move Player
      player.x = targetX;
      player.y = targetY;

      // 7. Check Loot
      if (map.loot && map.loot.active && player.x === map.loot.x && player.y === map.loot.y) {
        player.atk += 1;
        map.loot.active = false;
        showMessage("Found a rusty sword! ATK +1", true);
      }

      // 8. End Turn (Enemy moves)
      endTurn();
    }

    function endTurn() {
      let map = maps[currentMap];
      
      if (map.enemy && map.enemy.alive) {
        moveEnemy(map.enemy);
        // Check if enemy hit player
        if (map.enemy.x === player.x && map.enemy.y === player.y) {
          player.hp -= map.enemy.atk;
          if (player.hp <= 0) {
            player.hp = 0;
            gameState = 'DEAD';
            showMessage("You Died");
          }
        }
      }
      draw();
    }

    function moveEnemy(enemy) {
      let dx = player.x - enemy.x;
      let dy = player.y - enemy.y;
      let dist = Math.abs(dx) + Math.abs(dy);

      if (dist <= 6) {
        let moveX = 0;
        let moveY = 0;
        
        if (Math.abs(dx) > Math.abs(dy)) {
          moveX = Math.sign(dx);
        } else {
          moveY = Math.sign(dy);
        }

        let nextX = enemy.x + moveX;
        let nextY = enemy.y + moveY;

        if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
          enemy.x = nextX;
          enemy.y = nextY;
        } else {
          moveX = 0; moveY = 0;
          if (Math.abs(dy) > 0) moveY = Math.sign(dy);
          nextX = enemy.x + moveX; nextY = enemy.y + moveY;
          if (!isWall(nextX, nextY) && !(nextX === player.x && nextY === player.y)) {
            enemy.x = nextX;
            enemy.y = nextY;
          }
        }
      }
    }

    function showMessage(text, isDialog = false) {
      document.getElementById('msg-title').innerText = text;
      
      // If it's just dialog (like reading a chest or talking to NPC), let them click to continue
      let btn = document.querySelector('#message button');
      if (isDialog) {
        btn.innerText = "Continue";
        btn.onclick = () => { document.getElementById('message').style.display = 'none'; };
      } else {
        btn.innerText = "Restart";
        btn.onclick = restartGame;
      }
      
      document.getElementById('message').style.display = 'block';
    }

    function restartGame() {
      // Reset player
      player = { x: 10, y: 16, hp: 10, maxHp: 10, atk: 1 }; // Spawn at bottom center of hub
      gameState = 'PLAYING';
      currentMap = 'HUB';
      
      // Rebuild maps to reset enemies/loot
      buildMaps();
      
      document.getElementById('message').style.display = 'none';
      draw();
    }

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') doTurn(0, -1);
      if (e.key === 'ArrowDown' || e.key === 's') doTurn(0, 1);
      if (e.key === 'ArrowLeft' || e.key === 'a') doTurn(-1, 0);
      if (e.key === 'ArrowRight' || e.key === 'd') doTurn(1, 0);
      if (e.key === ' ' && gameState !== 'PLAYING') {
         // If dead/won, space restarts. If in dialog, space closes it.
         if (document.getElementById('message').style.display === 'block') {
             document.querySelector('#message button').click();
         } else {
             restartGame();
         }
      }
    });

    // Init
    buildMaps();
    restartGame(); // This sets the player position and starts the game
  </script>
</body>
</html>
